{t:"Първата ми HTML страница",
 body:`<p><b>HTML</b> (Hyper Text Markup Language) е език за описание на уеб страници. Работи се с <b>тагове</b> – ключови думи в ъглови скоби. Повечето са по двойки: <code>&lt;таг&gt;съдържание&lt;/таг&gt;</code>.</p>
 <p>Всеки документ има две части: <code>&lt;head&gt;</code> (информация за страницата) и <code>&lt;body&gt;</code> (видимото съдържание).</p>
 <div class="box"><code>&lt;!DOCTYPE html&gt;</code> – казва на браузъра, че е HTML5.<br><code>&lt;title&gt;</code> – заглавие в раздела на браузъра.<br><code>&lt;meta charset="UTF-8"&gt;</code> – за да се виждат правилно българските букви.</div>
 
<div class="fig"><svg class="w" viewBox="0 0 552 252" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="8" width="250" height="236" rx="10" fill="#f1f5f9" stroke="#3a5a8c" stroke-width="2"/><text x="30" y="30" font-size="15" fill="#3a5a8c" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >&lt;html&gt;</text><rect x="24" y="42" width="218" height="74" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="40" y="62" font-size="14" fill="#92400e" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >&lt;head&gt;</text><text x="60" y="82" font-size="11" fill="#1c2333" font-weight="normal" text-anchor="start" font-family="Consolas,monospace" >&lt;title&gt;Моята страница&lt;/title&gt;</text><text x="60" y="102" font-size="11" fill="#1c2333" font-weight="normal" text-anchor="start" font-family="Consolas,monospace" >&lt;meta charset=&quot;UTF-8&quot;&gt;</text><rect x="24" y="128" width="218" height="104" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="40" y="148" font-size="14" fill="#166534" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >&lt;body&gt;</text><text x="60" y="172" font-size="12" fill="#1c2333" font-weight="normal" text-anchor="start" font-family="Consolas,monospace" >&lt;h1&gt;Здравей!&lt;/h1&gt;</text><text x="60" y="196" font-size="12" fill="#1c2333" font-weight="normal" text-anchor="start" font-family="Consolas,monospace" >&lt;p&gt;Първата ми страница&lt;/p&gt;</text><text x="60" y="218" font-size="12" fill="#1c2333" font-weight="normal" text-anchor="start" font-family="Consolas,monospace" >&lt;img src=&quot;kot.png&quot;&gt;</text><rect x="310" y="8" width="230" height="236" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><path d="M310 40 L310 18 Q310 8 320 8 L530 8 Q540 8 540 18 L540 40Z" fill="#e2e8f0"/><rect x="318" y="14" width="120" height="24" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="378" y="31" font-size="11.5" fill="#1c2333" >Моята страница</text><line x1="310" y1="40" x2="540" y2="40" stroke="#94a3b8" stroke-width="1.5"/><text x="425" y="90" font-size="26" fill="#1c2333" font-weight="bold" >Здравей!</text><text x="425" y="122" font-size="14" fill="#1c2333" >Първата ми страница</text><text x="425" y="180" font-size="44" fill="#1c2333" >🐱</text><line x1="243" y1="62" x2="307.71600082753815" y2="34.51786266227831" stroke="#d97706" stroke-width="1.8"/><polygon points="316.0,31.0 309.7,39.1 305.8,29.9" fill="#d97706"/><line x1="244" y1="172" x2="333.08600848362363" y2="97.76165959698032" stroke="#16a34a" stroke-width="1.8"/><polygon points="340.0,92.0 336.3,101.6 329.9,93.9" fill="#16a34a"/><text x="425" y="232" font-size="11.5" fill="#566073" >видимо в браузъра</text></svg><small>Лявата част е кодът, дясната – какво показва браузърът. Заглавието от head отива в раздела, а body се вижда на страницата.</small></div>
<h3>Как е устроен един таг</h3>
<div class="fig"><svg viewBox="0 0 520 130" font-family="Consolas,monospace" font-size="22" font-weight="bold" text-anchor="middle"><rect x="5" y="30" width="125" height="40" rx="8" fill="#c7d2fe"/><text x="67" y="58">&lt;p&gt;</text><rect x="135" y="30" width="130" height="40" rx="8" fill="#fde68a"/><text x="200" y="58" font-size="18">Здравей!</text><rect x="270" y="30" width="125" height="40" rx="8" fill="#c7d2fe"/><text x="332" y="58">&lt;/p&gt;</text><text x="67" y="100" font-size="14" font-family="Arial">отварящ таг</text><text x="200" y="100" font-size="14" font-family="Arial">съдържание</text><text x="332" y="100" font-size="14" font-family="Arial">затварящ таг (със /)</text><rect x="400" y="30" width="3" height="40" fill="none"/>Атрибутите се пишат в отварящия таг: &lt;p class="intro"&gt;</small></div>
<p>Отварящият таг, съдържанието и затварящият таг заедно образуват <b>HTML елемент</b>. <br><b>Атрибутът</b> дава допълнителна информация за тага и винаги се пише в отварящия таг във формат <code>име="стойност" <body bgcolor="black"></code>.</p>
<h3>Двойни и единични тагове</h3>
<h3>Двойни тагове – имат отварящ и затварящ таг</h3>
<ul class="tg"><li><code>&lt;p&gt;…&lt;/p&gt;</code><span>абзац</span><span class="r">Текст</span></li><li><code>&lt;h1&gt;…&lt;/h1&gt;</code><span>заглавие</span><span class="r"><b style="font-size:1.4em">Заглавие</b></span></li><li><code>&lt;a&gt;…&lt;/a&gt;</code><span>връзка</span><span class="r"><u style="color:blue">Връзка</u></span></li><li><code>&lt;div&gt;…&lt;/div&gt;</code><span>блок-контейнер</span><span class="r">Блок</span></li></ul>
<h3>Единични тагове – без затварящ таг (нямат съдържание)</h3>
<ul class="tg"><li><code>&lt;br&gt;</code><span>нов ред</span><span class="r">ред 1<br>ред 2</span></li><li><code>&lt;hr&gt;</code><span>хоризонтална линия</span><span class="r"><hr style="width:80px"></span></li><li><code>&lt;img&gt;</code><span>изображение</span><span class="r">🖼️</span></li><li><code>&lt;input&gt;</code><span>поле за въвеждане</span><span class="r"><input size="8"></span></li><li><code>&lt;meta&gt;</code> <code style="min-width:0">&lt;link&gt;</code><span>информация в head</span></li></ul>
<div class="box"><b>Вложеност:</b> таговете се влагат един в друг като кутии – този, който е отворен последен, се затваря първи. <br> Правилно: <code>&lt;p&gt;&lt;b&gt;текст&lt;/b&gt;&lt;/p&gt;</code>.<br> Грешно: <code>&lt;p&gt;&lt;b&gt;текст&lt;/p&gt;&lt;/b&gt;</code>.<br><b>Коментар</b> (не се вижда в страницата): <code>&lt;!-- бележка --&gt;</code></div>
<table class="t"><tr><th>Таг</th><th>Значение</th><th>Затварящ?</th></tr>
<tr><td>&lt;html&gt;</td><td>цялата страница</td><td>да</td></tr><tr><td>&lt;head&gt;</td><td>информация за страницата</td><td>да</td></tr>
<tr><td>&lt;body&gt;</td><td>видимо съдържание</td><td>да</td></tr><tr><td>&lt;meta&gt;</td><td>кодировка, настройки</td><td>не</td></tr>
<tr><td>&lt;br&gt;, &lt;hr&gt;, &lt;img&gt;</td><td>нов ред, линия, картинка</td><td>не</td></tr></table>
<p><b>Задача:</b> Промени текста в редактора отдясно и виж резултата веднага. После го запази във файл <code>index.html</code> и го отвори с браузър.</p>`,
 code:`<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>София</title>
</head>
<body>
  София е столицата на България.
</body>
</html>`,
 quiz:[{q:"Кой елемент съдържа видимото съдържание на страницата?",o:["<head>","<title>","<body>"],a:2,w:"В <body> се поставят текст, изображения, връзки, таблици."},
 {q:"За какво служи <title>?",o:["Заглавие, което се показва в раздела на браузъра","Най-голямото заглавие на страницата","Фонов цвят"],a:0,w:"Заглавието е в <head> и не се показва в самата страница."},
 {q:"С какво разширение се записва HTML файл?",o:[".txt",".html",".doc"],a:1,w:"Файловете се записват като .html"}]},

{t:"Текст: абзаци, заглавия, форматиране",
 body:`<h3>Абзаци и нов ред</h3>
<ul class="tg"><li><code>&lt;p&gt;…&lt;/p&gt;</code><span>абзац (нов блок текст)</span></li><li><code>&lt;br&gt;</code><span>нов ред в същия абзац, без затварящ таг</span></li></ul>

<div class="fig"><svg class="w" viewBox="0 0 520 280" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="8" width="300" height="262" rx="6" fill="#fffdf7" stroke="#a8a29e" stroke-width="1.5"/><text x="158" y="48" font-size="22" fill="#1c2333" font-weight="bold" font-family="Georgia,serif" >Новини от училище</text><line x1="24" y1="60" x2="292" y2="60" stroke="#a8a29e" stroke-width="1"/><text x="24" y="90" font-size="16" fill="#1c2333" font-weight="bold" text-anchor="start" font-family="Georgia,serif" >Спорт</text><rect x="24" y="102" width="260" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><rect x="24" y="116" width="240" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><rect x="24" y="130" width="200" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><text x="24" y="168" font-size="16" fill="#1c2333" font-weight="bold" text-anchor="start" font-family="Georgia,serif" >Култура</text><rect x="24" y="180" width="250" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><rect x="24" y="194" width="260" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><rect x="24" y="208" width="150" height="7" rx="3" fill="#d6d3d1" stroke="#d6d3d1" stroke-width="0"/><text x="24" y="250" font-size="12" fill="#78716c" font-weight="bold" text-anchor="start" >Среща</text><rect x="70" y="242" width="160" height="7" rx="3" fill="#e7e5e4" stroke="#e7e5e4" stroke-width="0"/><line x1="380" y1="44" x2="325.0" y2="44.0" stroke="#dc2626" stroke-width="1.8"/><polygon points="316.0,44.0 325.0,39.0 325.0,49.0" fill="#dc2626"/><rect x="384" y="28" width="120" height="32" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="444" y="49" font-size="15" fill="#991b1b" font-weight="bold" font-family="Consolas,monospace" >&lt;h1&gt;</text><line x1="380" y1="86" x2="325.0" y2="86.0" stroke="#d97706" stroke-width="1.8"/><polygon points="316.0,86.0 325.0,81.0 325.0,91.0" fill="#d97706"/><rect x="384" y="70" width="120" height="32" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="444" y="91" font-size="15" fill="#92400e" font-weight="bold" font-family="Consolas,monospace" >&lt;h2&gt;</text><line x1="380" y1="128" x2="325.0" y2="128.0" stroke="#16a34a" stroke-width="1.8"/><polygon points="316.0,128.0 325.0,123.0 325.0,133.0" fill="#16a34a"/><rect x="384" y="112" width="120" height="32" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="444" y="133" font-size="15" fill="#166534" font-weight="bold" font-family="Consolas,monospace" >&lt;p&gt;</text><line x1="380" y1="164" x2="325.0" y2="164.0" stroke="#d97706" stroke-width="1.8"/><polygon points="316.0,164.0 325.0,159.0 325.0,169.0" fill="#d97706"/><rect x="384" y="148" width="120" height="32" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="444" y="169" font-size="15" fill="#92400e" font-weight="bold" font-family="Consolas,monospace" >&lt;h2&gt;</text><text x="444" y="212" font-size="12.5" fill="#991b1b" font-weight="bold" >Само един h1</text><text x="444" y="230" font-size="12.5" fill="#566073" >на страница –</text><text x="444" y="246" font-size="12.5" fill="#566073" >като заглавие на вестник</text></svg><small>Заглавията са като във вестник: най-голямото (h1) е главното, h2 са рубриките, а p е текстът</small></div>
<h3>Заглавия – от най-голямо до най-малко</h3>
<ul class="tg"><li><code>&lt;h1&gt;</code><span class="r"><b style="font-size:2em">Заглавие 1</b></span></li><li><code>&lt;h2&gt;</code><span class="r"><b style="font-size:1.5em">Заглавие 2</b></span></li><li><code>&lt;h3&gt;</code><span class="r"><b style="font-size:1.17em">Заглавие 3</b></span></li><li><code>&lt;h4&gt;</code><span class="r"><b>Заглавие 4</b></span></li><li><code>&lt;h5&gt;</code><span class="r"><b style="font-size:.83em">Заглавие 5</b></span></li><li><code>&lt;h6&gt;</code><span class="r"><b style="font-size:.67em">Заглавие 6</b></span></li></ul>
<h3>Форматиране на текст (всеки с отварящ и затварящ таг)</h3>
<ul class="tg"><li><code>&lt;b&gt;текст&lt;/b&gt;</code><span>удебелен (Bold)</span><span class="r"><b>текст</b></span></li><li><code>&lt;i&gt;текст&lt;/i&gt;</code><span>курсив (Italic)</span><span class="r"><i>текст</i></span></li><li><code>&lt;u&gt;текст&lt;/u&gt;</code><span>подчертан (Underline)</span><span class="r"><u>текст</u></span></li><li><code>&lt;strike&gt;текст&lt;/strike&gt;</code><span>зачеркнат</span><span class="r"><strike>текст</strike></span></li><li><code>&lt;sup&gt;2&lt;/sup&gt;</code><span>горен индекс</span><span class="r">10<sup>2</sup></span></li><li><code>&lt;sub&gt;2&lt;/sub&gt;</code><span>долен индекс</span><span class="r">H<sub>2</sub>O</span></li></ul>
 <div class="box">Важно: подреждай таговете правилно – първо отворен, последно затворен: <code>&lt;b&gt;&lt;i&gt;текст&lt;/i&gt;&lt;/b&gt;</code></div>
 <p><b>Опитай:</b> добави <code>&lt;h3&gt;</code> заглавие и направи думата „София“ удебелена.</p>`,
 code:`<h1>Моето училище</h1>
<h2>Малко заглавие</h2>
<p>Първи ред.<br>Втори ред в същия абзац.</p>
<p><b>127. СУ</b> <u>„Денкоглу“</u>, гр. София, <i>12<sup>e</sup> клас</i></p>
<p>H<sub>2</sub>O и 10<sup>2</sup></p>`,
 quiz:[{q:"Кой таг дава най-големия размер на заглавие?",o:["<h6>","<h1>","<p>"],a:1,w:"<h1> е най-голямо, <h6> е най-малко."},
 {q:"Какво прави <br>?",o:["Нов абзац","Нов ред в същия абзац","Удебеляване"],a:1,w:"<br> прекъсва реда и няма затварящ таг."},
 {q:"Кой таг прави текста курсив?",o:["<i>","<u>","<sup>"],a:0,w:"<i> = Italic."}]},

{t:"Хипервръзки и списъци",
 body:`<h3>Хипервръзка</h3>
<ul class="tg"><li><code>&lt;a href="адрес"&gt;текст&lt;/a&gt;</code><span>връзка към друга страница</span></li><li><code>target="_blank"</code><span>отваря връзката в нов раздел</span></li></ul>
<div class="fig"><svg viewBox="0 0 520 90" font-family="Consolas,monospace" font-size="19" font-weight="bold"><text x="10" y="40" fill="#3a5a8c">&lt;a</text><text x="52" y="40" fill="#dc2626">href="https://abv.bg" </text><text x="262" y="40" fill="#3a5a8c">&gt;</text><text x="282" y="40" fill="#16a34a">Поща</text><text x="345" y="40" fill="#3a5a8c">&lt;/a&gt;</text><text x="52" y="75" font-size="13" font-family="Arial" fill="#dc2626">↑ атрибут: КЪДЕ води</text><text x="282" y="75" font-size="13" font-family="Arial" fill="#16a34a">↑ текст: какво се вижда</text></svg></div>

<div class="fig"><svg class="w" viewBox="0 0 520 206" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="8" width="240" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="128" y="34" font-size="14" fill="#3a5a8c" font-weight="bold" font-family="Consolas,monospace" >&lt;ul&gt; – точки</text><circle cx="48" cy="65" r="6" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="70" y="70" font-size="17" fill="#1c2333" text-anchor="start" >Хляб</text><circle cx="48" cy="101" r="6" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="70" y="106" font-size="17" fill="#1c2333" text-anchor="start" >Мляко</text><circle cx="48" cy="137" r="6" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="70" y="142" font-size="17" fill="#1c2333" text-anchor="start" >Сирене</text><text x="128" y="186" font-size="12.5" fill="#566073" >редът няма значение</text><rect x="272" y="8" width="240" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="392" y="34" font-size="14" fill="#16a34a" font-weight="bold" font-family="Consolas,monospace" >&lt;ol&gt; – номера</text><circle cx="304" cy="65" r="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="304" y="70" font-size="14" fill="#166534" font-weight="bold" >1</text><text x="326" y="70" font-size="16" fill="#1c2333" text-anchor="start" >Включи</text><circle cx="304" cy="101" r="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="304" y="106" font-size="14" fill="#166534" font-weight="bold" >2</text><text x="326" y="106" font-size="16" fill="#1c2333" text-anchor="start" >Отвори редактора</text><circle cx="304" cy="137" r="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="304" y="142" font-size="14" fill="#166534" font-weight="bold" >3</text><text x="326" y="142" font-size="16" fill="#1c2333" text-anchor="start" >Пиши код</text><text x="392" y="186" font-size="12.5" fill="#566073" >редът е важен</text></svg><small>Всеки ред в списък е &lt;li&gt;. Ако редът е важен – ol, ако не – ul</small></div>
<h3>Списъци</h3>
<ul class="tg"><li><code>&lt;ul&gt;…&lt;/ul&gt;</code><span>списък с точки (unordered)</span><span class="r"><ul style="margin:0;padding-left:18px"><li style="all:revert">Ябълка</li><li style="all:revert">Круша</li></ul></span></li><li><code>&lt;ol&gt;…&lt;/ol&gt;</code><span>номериран списък (ordered)</span><span class="r"><ol style="margin:0;padding-left:20px"><li style="all:revert">Първо</li><li style="all:revert">Второ</li></ol></span></li><li><code>&lt;li&gt;…&lt;/li&gt;</code><span>един елемент (list item) – винаги вътре в ul или ol</span></li></ul>
 <p><b>Опитай:</b> смени адреса на връзката и добави още един елемент в списъка. (Кликни върху връзката в прегледа – тя ще се отвори в нов раздел на браузъра.)</p>`,
 code:`<p>Любим сайт: <a href="https://bg.wikipedia.org" target="_blank">Уикипедия</a></p>

<p>Отличници на випуска:</p>
<ul>
  <li>Алекс Иванов</li>
  <li>Светослав Петров</li>
</ul>

<p>Стъпки:</p>
<ol>
  <li>Отвори редактор</li>
  <li>Напиши кода</li>
  <li>Запази като .html</li>
</ol>`,
 quiz:[{q:"Кой атрибут съдържа адреса на връзката?",o:["src","href","alt"],a:1,w:"href = hypertext reference."},
 {q:"Кой таг прави номериран списък?",o:["<ul>","<ol>","<li>"],a:1,w:"<ol> е подреден списък (ordered list)."},
 {q:"Какво прави target=\"_blank\"?",o:["Изтрива връзката","Отваря в нов раздел","Оцветява връзката"],a:1,w:"Страницата се отваря в нов раздел."}]},

{t:"Изображения",
 body:`<p>Вмъкват се с <code>&lt;img&gt;</code> (без затварящ таг). Позволени формати: JPG, PNG, GIF.</p>
 <h3>Атрибути на &lt;img&gt;</h3>
<ul class="tg"><li><code>src="kartinka.png"</code><span>път до файла (source)</span></li><li><code>width="300"</code><span>ширина в пиксели</span></li><li><code>height="150"</code><span>височина в пиксели</span></li><li><code>alt="Залез"</code><span>текст, ако картинката не се зареди</span></li></ul>
<div class="fig"><svg viewBox="0 0 480 170" font-family="Arial" font-size="14" text-anchor="middle"><rect x="10" y="10" width="200" height="110" rx="8" fill="#fb923c"/><circle cx="110" cy="105" r="35" fill="#fde047"/><text x="110" y="145" font-weight="bold">width=200, height=110</text><text x="230" y="70" font-size="30">→</text><rect x="270" y="10" width="200" height="110" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6"/><text x="370" y="62" font-size="24">🖼️</text><text x="370" y="90" fill="#475569">Залез</text><text x="370" y="150" font-weight="bold">ако липсва файлът – alt текста</text></svg></div>
 <p>Файлът със снимката трябва да е в същата папка като <code>index.html</code>, ако пишеш само името му (напр. <code>src="kartinka.png"</code>). В полето „Пробвай сам“ името <code>kartinka.png</code> е примерна картинка, вградена в прегледа – ти променяш само <code>width</code> и <code>height</code> и гледаш как се разтяга или смалява.</p>`,
 code:`<!-- Променяй САМО числата: width (ширина) и height (височина) -->
<img src="kartinka.png" width="300" height="150" alt="Залез">

<!-- По-малка картинка: -->
<img src="kartinka.png" width="150" height="75" alt="Залез">`,
 quiz:[{q:"Какво е предназначението на alt?",o:["Размер на картинката","Алтернативен текст, ако картинката липсва","Рамка"],a:1,w:"alt описва изображението."},
 {q:"Кой атрибут задава файла на картинката?",o:["src","href","width"],a:0,w:"src = source (източник)."},
 {q:"Има ли <img> затварящ таг?",o:["Да, </img>","Не"],a:1,w:"<img> е самозатварящ се елемент."}]},

{t:"Таблици",
 body:`<p><code>&lt;table&gt;</code> – таблица, <code>&lt;tr&gt;</code> – ред, <code>&lt;td&gt;</code> – клетка, <code>&lt;th&gt;</code> – клетка със заглавие. Рамка се добавя с <code>border</code>.</p>
 <p>Обединяване на клетки: <code>colspan</code> (по колони) и <code>rowspan</code> (по редове).</p>
 <div class="fig"><svg viewBox="0 0 440 190" font-family="Arial" font-size="15" text-anchor="middle"><rect x="10" y="30" width="420" height="40" fill="#c7d2fe" stroke="#3a5a8c"/><text x="75" y="55" font-weight="bold">th Име</text><text x="220" y="55" font-weight="bold">th Клас</text><text x="360" y="55" font-weight="bold">th Оценка</text><rect x="10" y="70" width="420" height="40" fill="#fff" stroke="#3a5a8c"/><text x="75" y="95">td Иван</text><text x="220" y="95">td 12 А</text><text x="360" y="95">td 6</text><rect x="10" y="110" width="420" height="40" fill="#fff" stroke="#3a5a8c"/><text x="75" y="135">td Мария</text><text x="220" y="135">td 12 Б</text><text x="360" y="135">td 5</text><text x="220" y="20" fill="#3a5a8c" font-weight="bold">table</text><text x="220" y="175" fill="#dc2626">всеки хоризонтален ред е един tr</text></svg><small>th = заглавна клетка, td = клетка с данни, tr = целият ред</small></div>
<h3>Откъде идват имената?</h3>
<p>Всеки таг е съкращение от английски израз:</p>
<table class="t"><tr><th>Таг</th><th>Пълно име</th><th>Значение</th></tr>
<tr><td>&lt;table&gt;</td><td>table</td><td>цялата таблица</td></tr>
<tr><td>&lt;tr&gt;</td><td><b>t</b>able <b>r</b>ow</td><td>ред от таблицата</td></tr>
<tr><td>&lt;td&gt;</td><td><b>t</b>able <b>d</b>ata</td><td>клетка с данни</td></tr>
<tr><td>&lt;th&gt;</td><td><b>t</b>able <b>h</b>eader</td><td>клетка със заглавие (удебелен, центриран текст)</td></tr>
<tr><td>&lt;caption&gt;</td><td>caption</td><td>надпис над таблицата</td></tr></table>
<div class="box">Правило: таблицата се изгражда <b>ред по ред</b>. Вътре в &lt;table&gt; има &lt;tr&gt;, а вътре в &lt;tr&gt; – клетки &lt;td&gt;/&lt;th&gt;. Колоните не се описват – те се получават от броя клетки във всеки ред.</div>
<h3>Как се оцветява таблица?</h3>
<p>Цветовете по принцип се задават с <b>CSS</b> – ще го учим в следващата тема „CSS – стилове и цветове“. Но таблицата може да се оцвети и <b>още сега, директно в HTML</b>, по два начина.</p>
<p><b>1) С атрибута <code>style</code></b> (препоръчителният начин). Пише се в тага, който искаш да оцветиш. <code>background-color</code> е цветът на фона, <code>color</code> – цветът на текста. Стойността е име на цвят или HEX код:</p>
<pre>&lt;table style="background-color:#f0fdf4"&gt;      &lt;!-- цялата таблица --&gt;
&lt;tr style="background-color:lightblue"&gt;       &lt;!-- един цял ред --&gt;
&lt;td style="background-color:#fde68a"&gt;        &lt;!-- само една клетка --&gt;
&lt;th style="background-color:#3a5a8c; color:white"&gt;  &lt;!-- фон + бял текст --&gt;</pre>
<p><b>2) С атрибута <code>bgcolor</code></b> – старият HTML начин. Още работи, но е остарял и в нови сайтове не се ползва:</p>
<pre>&lt;tr bgcolor="lightblue"&gt;</pre>
<table class="t"><tr><th>Цвят</th><th>Име</th><th>HEX код</th></tr>
<tr><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:lightblue;vertical-align:middle"></span></td><td>lightblue</td><td>#add8e6</td></tr>
<tr><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:lightgreen;vertical-align:middle"></span></td><td>lightgreen</td><td>#90ee90</td></tr>
<tr><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#fde68a;vertical-align:middle"></span></td><td>–</td><td>#fde68a</td></tr>
<tr><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#c7d2fe;vertical-align:middle"></span></td><td>–</td><td>#c7d2fe</td></tr>
<tr><td><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:pink;vertical-align:middle"></span></td><td>pink</td><td>#ffc0cb</td></tr></table>
<p><b>Пример:</b> заглавен ред в синьо и всеки втори ред в различен цвят. В HTML <code>style</code> се слага на всеки ред поотделно:</p>
<table border="1" cellpadding="6" style="border-collapse:collapse;margin:10px 0">
<tr style="background-color:#3a5a8c;color:white"><th>Ден</th><th>Сутрин</th><th>Следобед</th></tr>
<tr><td>Понеделник</td><td>Училище</td><td>Спорт</td></tr>
<tr style="background-color:#e0f2fe"><td>Вторник</td><td>Училище</td><td>Уроци</td></tr>
<tr><td>Сряда</td><td>Училище</td><td>Музика</td></tr>
<tr style="background-color:#e0f2fe"><td>Четвъртък</td><td>Училище</td><td>Уроци</td></tr></table>
<pre>&lt;tr style="background-color:#3a5a8c; color:white"&gt;   &lt;!-- заглавен ред --&gt;
  &lt;th&gt;Ден&lt;/th&gt;&lt;th&gt;Сутрин&lt;/th&gt;&lt;th&gt;Следобед&lt;/th&gt;
&lt;/tr&gt;
&lt;tr&gt;...&lt;/tr&gt;                                   &lt;!-- 1-ви ред: без цвят --&gt;
&lt;tr style="background-color:#e0f2fe"&gt;...&lt;/tr&gt;   &lt;!-- 2-ри ред: светлосин --&gt;</pre>
<div class="box">Когато научим CSS, оцветяването на всеки втори ред ще става с едно правило за цялата таблица, без да пишеш <code>style</code> на всеки ред. Засега го правиш на ръка.</div>
<p><b>Опитай:</b> добави трети ред с твой ученик и оцвети заглавния ред (с <code>style="background-color:…"</code> в <code>&lt;tr&gt;</code>).</p>`,
 code:`<table border="1" cellpadding="6" style="border-collapse:collapse">
  <!-- заглавен ред с фон -->
  <tr style="background-color:#c7d2fe">
    <th>Име</th><th>Клас</th><th>Оценка</th>
  </tr>
  <tr><td>Иван</td><td>12 А</td><td>6</td></tr>
  <!-- цял ред в друг цвят -->
  <tr style="background-color:#e0f2fe"><td>Мария</td><td>12 Б</td><td>5</td></tr>
  <!-- една клетка в друг цвят -->
  <tr><td colspan="3" align="center" style="background-color:#fde68a">Общо: 2 ученици</td></tr>
</table>`,
 quiz:[{q:"Кой таг е ред в таблица?",o:["<td>","<tr>","<th>"],a:1,w:"<tr> = table row."},
 {q:"Кой атрибут обединява клетки по колони?",o:["rowspan","colspan","border"],a:1,w:"colspan обединява по хоризонтала."},
 {q:"Коя клетка е заглавна?",o:["<th>","<tr>","<table>"],a:0,w:"<th> = table header, текстът е удебелен и центриран."},{q:"Какво означава td?",o:["table data – клетка с данни","table design","text direction"],a:0,w:"td = table data, а tr = table row."}]},

{t:"CSS – стилове и цветове",
 body:`<p><b>CSS</b> (Cascading Style Sheets) определя как изглежда страницата. Записва се така: <br> <code>селектор { свойство: стойност; }</code></p>
 <p>Три начина за включване: <br> 1) вътре в тага – <code>style="…"</code>, <br> 2) в <code>&lt;style&gt;</code> в head, <br> 3) външен файл <code>&lt;link rel="stylesheet" href="style.css"&gt;</code> (най-добрият – една промяна важи за целия сайт).</p>

<div class="fig"><svg class="w" viewBox="0 0 544 236" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="24" width="200" height="200" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="108" y="16" font-size="14" fill="#566073" font-weight="bold" >Само HTML</text><text x="24" y="56" font-size="18" fill="#1c2333" font-weight="bold" text-anchor="start" font-family="Times New Roman,serif" >Моето кафене</text><text x="24" y="84" font-size="13" fill="#1c2333" text-anchor="start" font-family="Times New Roman,serif" >Най-доброто кафе в града.</text><text x="24" y="108" font-size="13" fill="#1d4ed8" text-anchor="start" font-family="Times New Roman,serif" >Вижте менюто</text><line x1="24" y1="111" x2="100" y2="111" stroke="#1d4ed8" stroke-width="1"/><rect x="24" y="124" width="70" height="24" rx="3" fill="#efefef" stroke="#767676" stroke-width="1"/><text x="59" y="141" font-size="12" fill="#1c2333" >Поръчай</text><line x1="216" y1="124" x2="283.0" y2="124.0" stroke="#6366f1" stroke-width="3"/><polygon points="292.0,124.0 283.0,129.0 283.0,119.0" fill="#6366f1"/><text x="254" y="112" font-size="15" fill="#4338ca" font-weight="bold" >+ CSS</text><rect x="300" y="24" width="232" height="200" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="416" y="16" font-size="14" fill="#166534" font-weight="bold" >HTML + CSS</text><path d="M300 76 L300 36 Q300 24 312 24 L520 24 Q532 24 532 36 L532 76Z" fill="#7c3f1d"/><text x="416" y="58" font-size="20" fill="#fff7ed" font-weight="bold" >☕ Моето кафене</text><text x="416" y="100" font-size="14" fill="#44403c" >Най-доброто кафе в града.</text><rect x="316" y="114" width="64" height="50" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1"/><text x="348" y="144" font-size="11.5" fill="#1c2333" font-weight="bold" >Еспресо</text><rect x="386" y="114" width="64" height="50" rx="10" fill="#fed7aa" stroke="#d97706" stroke-width="1"/><text x="418" y="144" font-size="11.5" fill="#1c2333" font-weight="bold" >Капучино</text><rect x="456" y="114" width="64" height="50" rx="10" fill="#fecaca" stroke="#d97706" stroke-width="1"/><text x="488" y="144" font-size="11.5" fill="#1c2333" font-weight="bold" >Мока</text><rect x="364" y="178" width="104" height="32" rx="16" fill="#7c3f1d" stroke="#7c3f1d" stroke-width="1.5"/><text x="416" y="199" font-size="14" fill="#fff" font-weight="bold" >Поръчай</text></svg><small>Един и същ HTML – без и със CSS. CSS променя цветове, шрифтове, подредба и форма</small></div>
<h3>Цветове – 4 начина</h3>
<p>
  <b>1. Име:</b> <code>red</code><br>
  <b>2. HEX (шестнайсетичен код):</b> <code>#FF0000</code><br>
  <b>3. RGB (червено, зелено, синьо):</b> <code>rgb(255, 0, 0)</code><br>
  <b>4. HSL (тон, наситеност, осветеност):</b> <code>hsl(0, 100%, 50%)</code>
</p>
 <p><code>color</code> – цвят на текста, <code>background-color</code> – фон, <code>font-size</code>, <code>text-align</code>, <code>background-image</code> – фоново изображение.</p>
 <h3>Как се включва CSS – 3 начина</h3>
<p><b>1) Вграден (inline)</b> – директно в тага, важи само за него:</p>
<pre>&lt;p style="color:red; font-size:20px;"&gt;Червен текст&lt;/p&gt;</pre>
<p><b>2) Вътрешен (internal)</b> – в <code>&lt;style&gt;</code> в <code>&lt;head&gt;</code>, важи за цялата страница:</p>
<pre>&lt;head&gt;
  &lt;style&gt;
    p { color: red; }
  &lt;/style&gt;
&lt;/head&gt;</pre>
<p><b>3) Външен (external)</b> – отделен файл <code>style.css</code>, свързан с <code>&lt;link&gt;</code>. Важи за всички страници, които го свързват:</p>
<pre>&lt;!-- в index.html --&gt;
&lt;link rel="stylesheet" href="style.css"&gt;

/* във файла style.css (без таг style!) */
p { color: red; }</pre>
<div class="box">Ако стиловете си противоречат, печели най-конкретният: <b>вграден → вътрешен/външен</b>. За истински сайтове се ползва външен файл.</div>
<h3>Как се пише CSS правило</h3>
<pre>селектор  {  свойство: стойност;  свойство: стойност;  }
   h1     {  color: blue;          font-size: 30px;     }</pre>
<p>Селекторът казва <i>кой</i> елемент да се оформи, а в къдравите скоби са свойствата. Всяко свойство завършва с <code>;</code></p>
<h3>Цветови модели </h3>
<ul class="tg">
<li><code>red</code><span style="flex:1;min-width:240px"><b>1) Име на цвят</b> – английската дума: red, blue, green, yellow, black, white… Най-лесно, но има ограничен избор.</span></li>
<li><code>rgb(255,0,0)</code><span style="flex:1;min-width:240px"><b>2) RGB</b> = <b>R</b>ed (червено), <b>G</b>reen (зелено), <b>B</b>lue (синьо). Цветът се получава от смесване на трите, всяко от 0 (няма) до 255 (най-много).<br><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(255,0,0);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(255,0,0)</code> червено &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(0,255,0);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(0,255,0)</code> зелено &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(0,0,255);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(0,0,255)</code> синьо<br><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(255,255,0);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(255,255,0)</code> жълто &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(0,0,0);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(0,0,0)</code> черно &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgb(255,255,255);vertical-align:middle"></span> <code style="font-size:1em;min-width:0">rgb(255,255,255)</code> бяло</span></li>
<li><code>#FF0000</code><span style="flex:1;min-width:240px"><b>3) HEX – шестнадесетичен (16-ичен) код.</b> Това е същият RGB цвят, но числата са записани в бройна система с основа 16. В нея има 16 знака: цифрите <b>0–9</b> и буквите <b>A–F</b> (A=10, B=11, C=12, D=13, E=14, F=15). Кодът започва с <b>#</b> и има три двойки: <b>#RRGGBB</b> (червено, зелено, синьо). <b>00</b> е най-малко (0), <b>FF</b> е най-много (255).<br><span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#FF0000;vertical-align:middle"></span> <code style="font-size:1em;min-width:0">#FF0000</code> червено &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#00FF00;vertical-align:middle"></span> <code style="font-size:1em;min-width:0">#00FF00</code> зелено &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#0000FF;vertical-align:middle"></span> <code style="font-size:1em;min-width:0">#0000FF</code> синьо &nbsp; <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:#FFFFFF;vertical-align:middle"></span> <code style="font-size:1em;min-width:0">#FFFFFF</code> бяло</span></li>
<li><code>hsl(0,100%,50%)</code><span style="flex:1;min-width:240px"><b>4) HSL</b> – цветът се описва с три неща:<br><b>H</b>ue – <b>тон (нюанс)</b>: кой е самият цвят, ъгъл на цветното колело от 0° до 360°. <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(0,100%,50%);vertical-align:middle"></span> 0° червено, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(60,100%,50%);vertical-align:middle"></span> 60° жълто, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(120,100%,50%);vertical-align:middle"></span> 120° зелено, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(180,100%,50%);vertical-align:middle"></span> 180° циан, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(240,100%,50%);vertical-align:middle"></span> 240° синьо, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(300,100%,50%);vertical-align:middle"></span> 300° виолетово.<br><b>S</b>aturation – <b>наситеност</b> (0%–100%): колко е „чист“ цветът. <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(210,0%,50%);vertical-align:middle"></span> 0% е сиво, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(210,100%,50%);vertical-align:middle"></span> 100% е ярък цвят.<br><b>L</b>ightness – <b>светлина</b> (0%–100%): <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(210,100%,0%);vertical-align:middle"></span> 0% е черно, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(210,100%,50%);vertical-align:middle"></span> 50% е нормален цвят, <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:hsl(210,100%,100%);vertical-align:middle"></span> 100% е бяло.</span></li>
<li><code>rgba(255,0,0,0.5)</code><span style="flex:1;min-width:240px"><b>5) RGBA / HSLA</b> – като RGB и HSL, но с добавена прозрачност (alpha) от 0 (напълно прозрачно) до 1 (напълно плътно). <span style="display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid #889;background:rgba(255,0,0,0.5);vertical-align:middle"></span></span></li>
</ul>
<div class="fig"><b>HSL нагледно</b><div style="text-align:left;font-size:.9rem">Hue (нюанс) 0° → 360°</div><div class="bar" style="background:linear-gradient(to right,hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,50%),hsl(180,100%,50%),hsl(240,100%,50%),hsl(300,100%,50%),hsl(360,100%,50%))"></div><div style="text-align:left;font-size:.9rem">Saturation (наситеност) 0% сиво → 100% ярко</div><div class="bar" style="background:linear-gradient(to right,hsl(210,0%,50%),hsl(210,100%,50%))"></div><div style="text-align:left;font-size:.9rem">Lightness (светлина) 0% черно → 50% цвят → 100% бяло</div><div class="bar" style="background:linear-gradient(to right,#000,hsl(210,100%,50%),#fff)"></div></div>
<div class="fig"><svg viewBox="0 0 300 190" width="300"><rect width="300" height="190" rx="10" fill="#000"/><g style="mix-blend-mode:screen"><circle cx="120" cy="75" r="55" fill="#f00" style="mix-blend-mode:screen"/><circle cx="180" cy="75" r="55" fill="#0f0" style="mix-blend-mode:screen"/><circle cx="150" cy="125" r="55" fill="#00f" style="mix-blend-mode:screen"/></g></svg><small>RGB смесва светлини: червено + зелено + синьо = бяло; червено + зелено = жълто</small></div>
<p>Съвет: с HSL лесно правиш светли и тъмни версии на един цвят – сменяш само Lightness: <code>hsl(210,80%,30%)</code> тъмно синьо, <code>hsl(210,80%,85%)</code> светло синьо.</p>
<p><b>Опитай:</b> смени цветовете с HEX и HSL стойности по твой избор.</p>`,

{t:"CSS: div, span, класове и селектори",
 body:`<p><code>&lt;div&gt;</code> е универсален <b>блок-контейнер</b>: започва на нов ред и заема цялата ширина. Вътре може да има текст, картинки и други елементи. <br> <code>&lt;span&gt;</code> е <b>вграден</b> контейнер – стои в реда на текста и служи за оформяне на малка част от него.</p>
 <h3>Селектори – как CSS намира елемента</h3>
 <table class="t"><tr><th>Селектор</th><th>Как се пише</th><th>Кога се ползва</th></tr>
 <tr><td>По таг</td><td><code>p { … }</code></td><td>за всички абзаци</td></tr>
 <tr><td>По <b>клас</b></td><td><code>.karta { … }</code> (точка пред името)</td><td>за много елементи; в HTML: <code>class="karta"</code></td></tr>
 <tr><td>По <b>id</b></td><td><code>#glavno { … }</code> (диез пред името)</td><td>за един уникален елемент; в HTML: <code>id="glavno"</code></td></tr>
 <tr><td>Група</td><td><code>h1, h2 { … }</code></td><td>едни стилове за няколко тага</td></tr>
 <tr><td>Вложен</td><td><code>div p { … }</code></td><td>само абзаците вътре в div</td></tr>
 <tr><td>Състояние</td><td><code>.btn:hover { … }</code></td><td>когато мишката е върху елемента</td></tr></table>
 <div class="box"><b>Клас или id?</b> Класът може да се ползва много пъти и един елемент може да има няколко класа (<code>class="karta cherven"</code>). Id е само един на страница. Имената се пишат на латиница, без интервали.</div>
 
<div class="fig"><svg class="w" viewBox="0 0 520 160" font-family="Arial" font-size="14" text-anchor="middle"><rect x="16" y="36" width="108" height="76" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/><text x="70" y="66" font-size="16" fill="#1c2333" font-weight="bold" >Карта</text><text x="70" y="92" font-size="11" fill="#1d4ed8" font-weight="normal" font-family="Consolas,monospace" >class=&quot;karta&quot;</text><rect x="136" y="36" width="108" height="76" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/><text x="190" y="66" font-size="16" fill="#1c2333" font-weight="bold" >Карта</text><text x="190" y="92" font-size="11" fill="#1d4ed8" font-weight="normal" font-family="Consolas,monospace" >class=&quot;karta&quot;</text><rect x="256" y="36" width="108" height="76" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/><text x="310" y="66" font-size="16" fill="#1c2333" font-weight="bold" >Карта</text><text x="310" y="92" font-size="11" fill="#1d4ed8" font-weight="normal" font-family="Consolas,monospace" >class=&quot;karta&quot;</text><rect x="376" y="36" width="128" height="76" rx="10" fill="#fed7aa" stroke="#f97316" stroke-width="2"/><text x="440" y="66" font-size="16" fill="#1c2333" font-weight="bold" >Главна</text><text x="440" y="92" font-size="11" fill="#c2410c" font-weight="normal" font-family="Consolas,monospace" >id=&quot;glavno&quot;</text><text x="190" y="22" font-size="15" fill="#1d4ed8" font-weight="bold" font-family="Consolas,monospace" >.karta { … }</text><text x="440" y="22" font-size="15" fill="#c2410c" font-weight="bold" font-family="Consolas,monospace" >#glavno { … }</text><line x1="16" y1="128" x2="352" y2="128" stroke="#3b82f6" stroke-width="2"/><text x="184" y="150" font-size="12.5" fill="#1d4ed8" >точка = клас → важи за много елементи</text><line x1="376" y1="128" x2="504" y2="128" stroke="#f97316" stroke-width="2"/><text x="440" y="150" font-size="12.5" fill="#c2410c" >диез = id → само за един</text></svg><small>Класът е като „униформа“ за много хора, а id – като име на един човек</small></div>
<h3>id или class – кога кое и защо</h3>
<p>И двата атрибута „закачат име“ на таг, за да могат CSS и JavaScript да го намерят. Разликата е в едно просто правило: <b>id е уникален, а class се повтаря</b>.</p>
<div style="display:flex;gap:14px;flex-wrap:wrap;margin:14px 0">
<div style="flex:1 1 260px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px"><b style="color:#1e40af">id – като факултетен номер</b><br>В университета всеки студент има свой номер и два еднакви няма. По него се намира <b>точно един</b> човек. Така и <code>id</code> сочи точно един елемент в страницата.</div>
<div style="flex:1 1 260px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px 16px"><b style="color:#166534">class – като роля или група</b><br>Всички в групата „Модератори“ имат еднакви права. В групата има <b>много</b> хора, а един човек може да е в няколко групи. Така <code>class</code> описва вид елементи, които изглеждат или се държат еднакво.</div></div>

<p><b>Кога ползваме id – и защо</b></p>
<ul>
<li><b>Елемент, който е само един в страницата</b> – логото, главното меню, футърът. Името му е като адрес – не може да се обърка с друг.</li>
<li><b>Връзка към място в същата страница.</b> Връзката <code>&lt;a href="#kontakti"&gt;</code> води до елемента с <code>id="kontakti"</code>. Адресът трябва да е уникален, иначе браузърът не знае къде да отиде.</li>
<li><b>JavaScript.</b> Скриптът трябва да намери точно един елемент: <code>document.getElementById("kontakti")</code>.</li>
<li><b>Поле и неговият надпис:</b> <code>&lt;label for="email"&gt;</code> се свързва с <code>&lt;input id="email"&gt;</code>.</li></ul>
<pre>&lt;header id="logo"&gt;TechShop&lt;/header&gt;
&lt;a href="#kontakti"&gt;Към контактите&lt;/a&gt;
…
&lt;footer id="kontakti"&gt;© 2026 TechShop&lt;/footer&gt;

/* CSS: диез пред името */
#logo { font-size: 28px; }</pre>

<p><b>Кога ползваме class – и защо</b></p>
<ul>
<li><b>Много елементи, които изглеждат еднакво</b> – карти на продукти, цени, бутони, новини в списък.</li>
<li><b>Промяна на едно място.</b> Стилът е записан веднъж и важи за всички – ако промениш рамката, тя се сменя навсякъде едновременно.</li>
<li><b>Няколко класа на един елемент</b>, разделени с интервал: общото е в единия клас, различното – в другия.</li></ul>
<pre>&lt;div class="produkt"&gt;Слушалки Pro &lt;span class="cena"&gt;89 лв.&lt;/span&gt;&lt;/div&gt;
&lt;div class="produkt promo"&gt;Слушалки Lite &lt;span class="cena"&gt;49 лв.&lt;/span&gt;&lt;/div&gt;
&lt;div class="produkt"&gt;Слушалки Max &lt;span class="cena"&gt;129 лв.&lt;/span&gt;&lt;/div&gt;

/* CSS: точка пред името */
.produkt { border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; }
.promo   { background: #fef3c7; }
.cena    { font-weight: bold; color: #15803d; }</pre>
<p>Така изглежда резултатът – един стил за трите карти, а втората има още един клас за различния фон:</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 16px"><div style="border:1px solid #cbd5e1;padding:12px;border-radius:10px;background:#fff">Слушалки Pro <b style="color:#15803d">89 лв.</b></div><div style="border:1px solid #cbd5e1;padding:12px;border-radius:10px;background:#fef3c7">Слушалки Lite <b style="color:#15803d">49 лв.</b></div><div style="border:1px solid #cbd5e1;padding:12px;border-radius:10px;background:#fff">Слушалки Max <b style="color:#15803d">129 лв.</b></div></div>

<p><b>Какво избирам?</b></p>
<table class="t"><tr><th>Елемент в сайта</th><th>Избор</th><th>Защо</th></tr>
<tr><td>Логото на сайта</td><td><code>id="logo"</code></td><td>има само едно</td></tr>
<tr><td>Секция „Контакти“, към която води връзка от менюто</td><td><code>id="kontakti"</code></td><td>връзката иска уникален адрес</td></tr>
<tr><td>Полето за имейл, свързано с <code>label</code></td><td><code>id="email"</code></td><td><code>for</code> сочи към един id</td></tr>
<tr><td>Броячът, който скриптът променя</td><td><code>id="broyach"</code></td><td>скриптът търси точно един елемент</td></tr>
<tr><td>Бутонът „Купи“ във всяка карта</td><td><code>class="btn"</code></td><td>повтаря се</td></tr>
<tr><td>Всяка новина в списъка с новини</td><td><code>class="novina"</code></td><td>повтаря се</td></tr>
<tr><td>Надпис „Изчерпано“ само при някои продукти</td><td><code>class="izcherpano"</code></td><td>слага се на няколко елемента</td></tr></table>
<div class="box"><b>Как да избера:</b> попитай се „Ще има ли второ такова?“. Ако да – <b>class</b>. Ако е само един и ми трябва уникален адрес за връзка или за скрипт – <b>id</b>. При колебание за оформление избирай <b>class</b>: в реалните проекти оформлението почти винаги е с класове, а id се пази за връзки вътре в страницата и за JavaScript.</div>
<div class="box"><b>Приоритет:</b> ако един елемент е оформен и с <code>#id</code>, и с <code>.class</code> и стиловете си противоречат, печели id, защото е по-конкретен.<br><b>Чести грешки:</b> един и същ <code>id</code> на два елемента (JavaScript намира само първия); объркани знаци – <code>#</code> е за id, <code>.</code> е за class, а в HTML не се пише точка: <code>class="btn"</code>; интервал в <code>id</code>; различни главни и малки букви (<code>Menu</code> и <code>menu</code> са различни имена).</div>

<h3>Кутийният модел</h3>
 <p>Всеки елемент е кутия: <b>content</b> (съдържание) → <b>padding</b> (вътрешен отстъп) → <b>border</b> (рамка) → <b>margin</b> (външен отстъп).</p>
 <div class="fig"><svg viewBox="0 0 360 230" font-family="Arial" font-size="14" text-anchor="middle"><rect x="5" y="5" width="350" height="220" rx="6" fill="#fed7aa" stroke="#f97316"/><text x="180" y="24" font-weight="bold">margin (външен отстъп)</text><rect x="40" y="35" width="280" height="160" fill="#fde68a" stroke="#111" stroke-width="3"/><text x="180" y="54" font-weight="bold">border (рамка)</text><rect x="65" y="65" width="230" height="110" fill="#bbf7d0" stroke="#22c55e"/><text x="180" y="83" font-weight="bold">padding (вътрешен отстъп)</text><rect x="100" y="95" width="160" height="55" rx="4" fill="#bfdbfe" stroke="#3b82f6"/><text x="180" y="127" font-weight="bold">content</text></svg><small>Всеки елемент в страницата е кутия с четири слоя</small></div>
 <p><b>Опитай:</b> направи трета карта с класовете <code>karta zelena</code>, смени ширината и закръглението.</p>`,
 code:`<style>
  .karta { width: 220px; padding: 14px; margin: 10px;
           border: 2px solid #3a5a8c; border-radius: 12px;

{t:"JavaScript – интерактивност",
 body:`<p><b>JavaScript</b> добавя поведение: реакция на клик, промяна на текст, проверки и др. HTML = структура, CSS = външен вид, JS = поведение.</p>
 <p>Код се пише в <code>&lt;script&gt;</code>. Функцията <code>function име() { … }</code> изпълнява код при извикване. <code>alert("…")</code> показва съобщение, а <code>document.getElementById("id")</code> намира елемент от страницата.</p>
 
<div class="fig"><svg class="w" viewBox="0 0 540 172" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="20" width="104" height="112" rx="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="60" y="62" font-size="30" fill="#1c2333" >🖱️</text><text x="60" y="92" font-size="13" fill="#1c2333" font-weight="bold" >Потребителят</text><text x="60" y="110" font-size="13" fill="#1c2333" >кликва</text><line x1="116" y1="76" x2="129.0" y2="76.0" stroke="#566073" stroke-width="2.5"/><polygon points="138.0,76.0 129.0,81.0 129.0,71.0" fill="#566073"/><rect x="142" y="20" width="104" height="112" rx="14" fill="#fed7aa" stroke="#f97316" stroke-width="2"/><text x="194" y="62" font-size="30" fill="#1c2333" >🔔</text><text x="194" y="92" font-size="13" fill="#1c2333" font-weight="bold" >Събитие</text><text x="194" y="110" font-size="13" fill="#1c2333" >onclick</text><line x1="250" y1="76" x2="263.0" y2="76.0" stroke="#566073" stroke-width="2.5"/><polygon points="272.0,76.0 263.0,81.0 263.0,71.0" fill="#566073"/><rect x="276" y="20" width="104" height="112" rx="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="328" y="62" font-size="30" fill="#1c2333" >🧠</text><text x="328" y="92" font-size="13" fill="#1c2333" font-weight="bold" >Функцията</text><text x="328" y="110" font-size="13" fill="#1c2333" >се изпълнява</text><line x1="384" y1="76" x2="397.0" y2="76.0" stroke="#566073" stroke-width="2.5"/><polygon points="406.0,76.0 397.0,81.0 397.0,71.0" fill="#566073"/><rect x="410" y="20" width="104" height="112" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="462" y="62" font-size="30" fill="#1c2333" >🖥️</text><text x="462" y="92" font-size="13" fill="#1c2333" font-weight="bold" >Страницата</text><text x="462" y="110" font-size="13" fill="#1c2333" >се променя</text><text x="270" y="158" font-size="12" fill="#1e293b" font-weight="normal" font-family="Consolas,monospace" >button.onclick = function() { alert(&quot;Здравей!&quot;); }</text></svg><small>JavaScript „слуша“ за действия на потребителя и отговаря с код</small></div>
<h3>Как се включва JavaScript – 3 начина</h3>
<p><b>1) Вграден</b> – директно в атрибут на събитие:</p>
<pre>&lt;button onclick="alert('Здравей!')"&gt;Кликни&lt;/button&gt;</pre>
<p><b>2) Вътрешен</b> – в таг <code>&lt;script&gt;</code> (обикновено в края на body):</p>
<pre>&lt;script&gt;
  alert("Здравей!");
&lt;/script&gt;</pre>
<p><b>3) Външен</b> – отделен файл <code>script.js</code>, който се свързва (във файла няма таг script):</p>
<pre>&lt;script src="script.js"&gt;&lt;/script&gt;</pre>

<div class="fig"><svg class="w" viewBox="0 0 540 152" font-family="Arial" font-size="14" text-anchor="middle"><text x="82" y="22" font-size="17" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >ime</text><path d="M20 34 L144 34 L134 100 L30 100Z" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="82" y="76" font-size="20" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >&quot;Ана&quot;</text><text x="82" y="122" font-size="12.5" fill="#566073" >текст (низ)</text><text x="82" y="142" font-size="11.5" fill="#566073" font-weight="normal" font-family="Consolas,monospace" >let ime = &quot;Ана&quot;;</text><text x="254" y="22" font-size="17" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >broi</text><path d="M192 34 L316 34 L306 100 L202 100Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/><text x="254" y="76" font-size="20" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >42</text><text x="254" y="122" font-size="12.5" fill="#566073" >число</text><text x="254" y="142" font-size="11.5" fill="#566073" font-weight="normal" font-family="Consolas,monospace" >let broi = 42;</text><text x="426" y="22" font-size="17" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >uspeh</text><path d="M364 34 L488 34 L478 100 L374 100Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/><text x="426" y="76" font-size="20" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >true</text><text x="426" y="122" font-size="12.5" fill="#566073" >вярно / невярно</text><text x="426" y="142" font-size="11.5" fill="#566073" font-weight="normal" font-family="Consolas,monospace" >let uspeh = true;</text></svg><small>Променливата е кутия с етикет: името е на етикета, стойността е вътре</small></div>
<h3>Основни понятия</h3>
<table class="t"><tr><th>Понятие</th><th>Какво е</th><th>Пример</th></tr>
<tr><td>Променлива</td><td>„кутия“ за стойност</td><td><code>let ime = "Ана";</code></td></tr>
<tr><td>Низ / число</td><td>текст в кавички / число</td><td><code>"Здравей"</code>, <code>42</code></td></tr>
<tr><td>Функция</td><td>именувана група команди, изпълнява се при извикване</td><td><code>function pozdrav() { … }</code></td></tr>
<tr><td>Събитие</td><td>реакция на действие на потребителя</td><td><code>onclick</code>, <code>oninput</code></td></tr>
<tr><td>Условие</td><td>избор какво да се изпълни</td><td><code>if (broi &gt; 5) { … } else { … }</code></td></tr>
<tr><td>DOM</td><td>начин да намерим и променим елементи</td><td><code>document.getElementById("id")</code></td></tr></table>
<div class="box">Редът е важен: ако <code>&lt;script&gt;</code> стои преди елементите, които търси, няма да ги намери. Затова скриптът обикновено е най-долу в <code>&lt;body&gt;</code>. Знакът <code>=</code> присвоява стойност, а <code>==</code> сравнява.</div>
<p><b>Опитай:</b> промени текста на съобщението и цвета. Добави поле, което да чете името: в примера отдолу въведи име и натисни бутона.</p>`,
 code:`<input id="ime" placeholder="Как се казваш?">
<button onclick="pozdrav()">Кликни ме</button>
<p id="tekst">Здравей!</p>
<script>
  let broi = 0;
  function pozdrav() {
    broi = broi + 1;
    const el = document.getElementById("tekst");
    const ime = document.getElementById("ime").value || "приятел";
    el.innerText = "Здравей, " + ime + "! Кликнал си " + broi + " пъти";
    el.style.color = broi % 2 == 0 ? "crimson" : "green";
  }
<\/script>`,
 quiz:[{q:"Кой таг включва JavaScript код?",o:["<js>","<script>","<style>"],a:1,w:"JavaScript се пише в <script>."},
 {q:"Какво прави alert(\"Здравей!\")?",o:["Показва диалогов прозорец","Изтрива страницата","Сменя фона"],a:0,w:"alert показва съобщение."},

6:{f:"stilove.html",g:"Оформи страница за твоето хоби в тъмна тема.",s:[
`Напиши HTML със заглавие <code>h1</code>, два абзаца и един <code>div</code> с клас <code>belezhka</code>.`,
`В <code>&lt;style&gt;</code> задай тъмен фон (напр. <code>#222</code>) и светъл текст на <code>body</code>.`,
`Центрирай <code>h1</code> и му задай цвят с HSL.`,
`За <code>.belezhka</code> задай пунктирана рамка (<code>border: 2px dashed …</code>), <code>padding</code> и закръглени ъгли.`,
`Със <code>style="…"</code> директно в един абзац го оцвети в друг цвят.`],
b:`Премести стиловете във външен файл <code>style.css</code> и го свържи с <code>&lt;link&gt;</code>.`},
7:{f:"menu-kafene.html",g:"Направи меню на кафене с карти за напитките.",s:[
`Три <code>div</code> с клас <code>napitka</code> – всяка с име, цена и описание.`,
`Цената да е в <code>span</code> с клас <code>cena</code> – удебелена и в друг цвят.`,
`Втората карта да има два класа (<code>class="napitka specialno"</code>) и различен фон.`,
`Заглавието „Нашето меню“ оформи със селектор по <code>id</code>.`,
`При <code>:hover</code> картите да получават сянка.`],
b:`Задай <code>padding</code>, <code>margin</code> и <code>border</code> на картите и с CSS коментар обясни кой слой на кутийния модел е кой.`},
10:{f:"flex-menu.html",g:"Направи хоризонтално меню и колони с Flexbox.",s:[
`Контейнер <code>nav</code> с 4 връзки – <code>display:flex</code> и <code>justify-content:space-around</code>.`,
`Под него контейнер с три карти една до друга и <code>gap</code> между тях.`,
`Първата карта да е два пъти по-широка: <code>flex:2</code>, а другите – <code>flex:1</code>.`,
`Нов блок с една кутия точно в центъра (по хоризонтал и вертикал) с <code>justify-content</code> и <code>align-items</code>.`],
b:`Смени картите да са една под друга с <code>flex-direction:column</code>.`},
11:{f:"adaptivna.html",g:"Направи адаптивна галерия от 6 кутии.",s:[
`В <code>head</code> добави <code>meta viewport</code>.`,
`Контейнер с <code>display:flex; flex-wrap:wrap</code> и 6 кутии в различни цветове.`,
`При <code>:hover</code> кутията да се завърта малко (<code>transform:rotate(5deg)</code>) с <code>transition</code> от .3s.`,
`С <code>@media (max-width:600px)</code> направи кутиите на цяла ширина, една под друга.`,
`Със <code>@keyframes</code> анимирай заглавието да се движи наляво-надясно.`],
b:`Смалявай прозореца на браузъра и запиши от каква ширина се сменя подредбата.`},
8:{f:"broyach.html",g:"Направи брояч на изпитите кафета с бутони.",s:[
`Абзац с <code>id</code>, който показва числото, и три бутона: „+1“, „−1“ и „Нула“.`,
`Променлива <code>let broi = 0;</code> и три функции – всяка променя <code>broi</code> и обновява текста с <code>innerText</code>.`,
`Когато броят стане по-голям от 5, оцвети числото в червено (с <code>if</code>), иначе го остави черно.`,
`При достигане на 10 покажи <code>alert("Стига кафе!")</code>.`],
b:`Не позволявай числото да става отрицателно.`},
12:{f:"masivi.html",g:"Работи с масив, цикъл и условие – този път не с оценки.",s:[
`Направи масив с 5 любими филма или песни.`,
`С <code>for</code> цикъл ги изведи като списък на страницата (с <code>innerHTML +=</code>).`,
`Поле <code>type="number"</code> и бутон, които проверяват дали числото е четно или нечетно (операторът <code>%</code>) и показват отговора.`,
`Добави условие: ако числото е по-голямо от 100, покажи и „голямо число“.`],
b:`С <code>for</code> изведи таблицата за умножение на въведеното число до 10.`},
13:{f:"pazaruvane.html",g:"Направи списък за пазаруване с DOM и събития.",s:[
`Поле, бутон „Добави“ и празен <code>ul</code>.`,
`При клик върху „Добави“ създай <code>li</code> с <code>createElement</code> и го вмъкни с <code>appendChild</code>; не добавяй празен текст.`,
`При клик върху продукт го зачертай с <code>classList.toggle</code> (стилът е в CSS клас).`,
`Покажи брояч „Продукти: N“, който се обновява.`,
`Добави бутон „Премахни зачертаните“: намери ги с <code>querySelectorAll</code> и извикай <code>remove()</code> за всеки.`],
b:`Добави и второ поле за количество, което се показва до продукта.`},
9:{f:"anketa.html",g:"Направи формуляр-анкета за училищна екскурзия.",s:[
`<code>label</code> и <code>input type="text"</code> за име – задължително (<code>required</code>).`,
`Поле <code>type="number"</code> за възраст и <code>type="email"</code> за имейл.`,
`Радио бутони за транспорт (автобус или влак – с еднакво <code>name</code>) и поне 3 отметки за дейности.`,
`<code>select</code> с 3 града и <code>textarea</code> за коментар с <code>placeholder</code>.`,
`Бутон за изпращане.`],
b:`Покажи с JavaScript съобщение „Благодарим, …!“ с въведеното име при изпращане.`},
21:{f:"blog.html",g:"Построй страница на пътеписен блог със семантични тагове.",s:[
`<code>header</code> с името на блога и кратко описание.`,
`<code>nav</code> с 3 връзки.`,
`<code>main</code> с една <code>section</code> и две <code>article</code> (по едно за всяко пътуване).`,
`<code>aside</code> с „Последни публикации“ и <code>footer</code> с твоето име. Постави <code>main</code> и <code>aside</code> един до друг: обгради ги в <code>div</code> със <code>style="display:flex;"</code> и дай на <code>aside</code> <code>style="width:30%;"</code>.`,
`Дай на един блок <code>id</code>, а на двете <code>article</code> – общ <code>class</code>, и в <code>&lt;style&gt;</code> ги оцвети по <code>id</code> и по клас.`],
b:`Оцвети всеки семантичен таг с различен фон и сравни със зоните от wireframe-а.`},
22:{f:"meta-dom.html",g:"Подготви правилен head и изследвай HTML дървото.",s:[
`Направи <code>head</code> с <code>meta charset</code>, <code>description</code>, <code>author</code>, <code>viewport</code> и <code>title</code>.`,
`В <code>body</code> сложи <code>div</code> с два абзаца и списък от 3 елемента.`,
`На лист или в Notepad++ нарисувай дървото от <code>html</code> надолу – кой е родител и кой е дете.`,
`Добави бутон, който с JavaScript показва тага на родителя на първия абзац и броя деца на <code>div</code>-а (<code>parentElement.tagName</code>, <code>children.length</code>).`],
b:`Покажи и текста на последното дете чрез <code>lastElementChild</code>.`}
};

1:{t:"Моето хоби",h:150,c:`<p>Обичам да карам колело из парка и из планината. Най-много ми харесва да откривам нови пътеки.</p><p>През уикенда често се събираме с приятели на дълга обиколка. Така и спортувам, и се забавлявам.</p><p>Мечтая един ден да обиколя с колелото цялото Черноморие.</p>`},
2:{t:"Любимият ми филм",h:300,c:`<h1>Любимият ми филм</h1><h2>За какво се разказва</h2><p><b>Властелинът на пръстените</b> излиза през <i>2001</i> година. Историята е за дълго пътуване и за приятелство.</p><p>Харесвам този филм, защото е <u>вълнуващ</u>.<br>Музиката в него е прекрасна.</p><h2>Малко наука</h2><p>CO<sub>2</sub> и площ 25 m<sup>2</sup></p>`},
3:{t:"Моите любими неща",h:360,c:`<h1>Моите любими неща</h1><h3>Любими храни</h3><ul><li>Пица</li><li>Палачинки</li><li>Шопска салата</li><li>Лютеница с хляб</li></ul><h3>Как се прави чай</h3><ol><li>Завари водата.</li><li>Сложи торбичката за 3 минути.</li><li>Подсладѝ и пий.</li></ol><p><a href="#" onclick="return false">Любимият ми сайт (в нов раздел)</a></p><p><a href="#" onclick="return false">Към втората страница →</a></p>`},
4:{t:"Моите снимки",h:470,c:`<h1>Моите снимки</h1><img src="${PVimg('#7dd3fc','#15803d')}" width="400" alt="Планинска гледка"><br><br><img src="${PVimg('#fda4af','#9f1239')}" width="150" height="100" alt="Залез"><br><br><img src="nyama-takava-snimka.png" width="150" height="40" alt="Тук трябваше да има снимка на езеро">`},
5:{t:"Моята програма",h:340,c:`<table border="1" cellpadding="6"><caption><b>Моята седмица</b></caption><tr><th>Ден</th><th>Сутрин</th><th>Следобед</th></tr><tr><td>Понеделник</td><td>Училище</td><td>Футбол</td></tr><tr><td>Вторник</td><td>Училище</td><td>Уроци</td></tr><tr><td>Сряда</td><td>Училище</td><td rowspan="2">Музикално училище</td></tr><tr><td>Четвъртък</td><td>Училище</td></tr><tr><td>Петък</td><td>Училище</td><td>Кино</td></tr><tr><td>Събота и неделя</td><td colspan="2" align="center">Почивка</td></tr></table>`},
6:{t:"Стилове – тъмна тема",h:290,c:`<style>body{background:#222;color:#eee;font-family:Arial;margin:12px}h1{text-align:center;color:hsl(190,80%,60%)}.belezhka{border:2px dashed #facc15;padding:12px;border-radius:12px;margin-top:12px}</style><h1>Моето хоби: фотография</h1><p>Снимам природа, градски улици и понякога портрети на приятели.</p><p>Най-ценното за мен е да хвана точния момент.</p><p style="color:#fca5a5">Този абзац е оцветен директно със style.</p><div class="belezhka">Бележка: следващият излет е в Рила.</div>`},
7:{t:"Меню на кафене",h:330,c:`<style>body{font-family:Arial;margin:12px;background:#fdf8f3}#zaglavie{text-align:center;color:#5b3a1e}.napitka{background:#fff;border:1px solid #e7d9c8;border-radius:10px;padding:10px 14px;margin:10px 0;transition:box-shadow .2s}.napitka:hover{box-shadow:0 6px 16px rgba(0,0,0,.18)}.specialno{background:#fff1d6}.cena{font-weight:bold;color:#b45309;float:right}</style><h1 id="zaglavie">Нашето меню</h1><div class="napitka"><b>Еспресо</b><span class="cena">2.20 лв.</span><br>Силно и ароматно кафе.</div><div class="napitka specialno"><b>Айс лате</b><span class="cena">4.50 лв.</span><br>Специалитет на деня – със сладолед.</div><div class="napitka"><b>Горещ шоколад</b><span class="cena">3.80 лв.</span><br>Гъст, с лека нотка канела.</div>`},
10:{t:"Flexbox меню",h:420,c:`<style>body{font-family:Arial;margin:10px}nav{display:flex;justify-content:space-around;background:#2f4a73;padding:10px;border-radius:8px}nav a{color:#fff;text-decoration:none;font-weight:bold}.row{display:flex;gap:10px;margin:12px 0}.k{background:#e0e7ff;padding:16px;border-radius:8px;flex:1}.k.shiroka{flex:2;background:#c7d2fe}.centr{display:flex;justify-content:center;align-items:center;height:130px;background:#f1f5f9;border-radius:8px}.centr div{background:#16a34a;color:#fff;padding:14px 22px;border-radius:8px}</style><nav><a href="#">Начало</a><a href="#">Новини</a><a href="#">Галерия</a><a href="#">Контакти</a></nav><div class="row"><div class="k shiroka">Карта 1 (два пъти по-широка)</div><div class="k">Карта 2</div><div class="k">Карта 3</div></div><div class="centr"><div>Точно в центъра</div></div>`},
11:{t:"Адаптивна галерия",h:340,c:`<style>body{font-family:Arial;margin:10px;overflow-x:hidden}h1{animation:dvizhi 3s ease-in-out infinite alternate;font-size:1.4rem}@keyframes dvizhi{from{transform:translateX(-30px)}to{transform:translateX(30px)}}.g{display:flex;flex-wrap:wrap;gap:10px}.g div{width:150px;height:100px;border-radius:10px;transition:transform .3s}.g div:hover{transform:rotate(5deg)}@media(max-width:600px){.g div{width:100%}}</style><h1>Моята галерия</h1><div class="g"><div style="background:#f87171"></div><div style="background:#fb923c"></div><div style="background:#facc15"></div><div style="background:#4ade80"></div><div style="background:#38bdf8"></div><div style="background:#a78bfa"></div></div><p style="color:#64748b;font-size:.85rem">Задръж мишката върху кутия – тя се завърта. Смали прозореца – кутиите се подреждат една под друга.</p>`},
8:{t:"Брояч на кафета",h:260,c:`<div style="font-family:Arial;text-align:center;margin-top:16px"><h2>Изпити кафета днес</h2><p id="chislo" style="font-size:3rem;margin:6px;color:black">0</p><button onclick="pl()">+1</button> <button onclick="mi()">−1</button> <button onclick="nu()">Нула</button><p style="color:#64748b;font-size:.85rem">Опитай: над 5 числото става червено, на 10 излиза съобщение.</p></div><script>let broi=0;function sh(){const e=document.getElementById('chislo');e.innerText=broi;e.style.color=broi>5?'red':'black'}function pl(){broi++;sh();if(broi==10)alert('Стига кафе!')}function mi(){broi--;sh()}function nu(){broi=0;sh()}<\/script>`},
12:{t:"Масиви и цикли",h:380,c:`<div style="font-family:Arial;margin:12px"><h2>Любими филми</h2><div id="sp"></div><h3>Четно или нечетно?</h3><input type="number" id="n" placeholder="Въведи число" style="padding:5px"> <button onclick="pr()">Провери</button><p id="o" style="font-weight:bold"></p></div><script>const f=['Интерстелар','Спирит','Аватар','Кунг фу панда','Шрек'];for(let i=0;i<f.length;i++){document.getElementById('sp').innerHTML+='<p style="margin:3px 0">'+(i+1)+'. '+f[i]+'</p>'}function pr(){const x=Number(document.getElementById('n').value);let t=x%2==0?x+' е четно число.':x+' е нечетно число.';if(x>100)t+=' Голямо число!';document.getElementById('o').innerText=t}<\/script>`},
13:{t:"Списък за пазаруване",h:400,c:`<style>body{font-family:Arial;margin:12px}li{cursor:pointer;margin:4px 0}.zach{text-decoration:line-through;color:#94a3b8}</style><h2>Списък за пазаруване</h2><input id="p" placeholder="Продукт"> <button onclick="dob()">Добави</button> <button onclick="pre()">Премахни зачертаните</button><p id="br"></p><ul id="sp"></ul><p style="color:#64748b;font-size:.85rem">Кликни върху продукт, за да го зачертаеш.</p><script>function br(){document.getElementById('br').innerText='Продукти: '+document.querySelectorAll('#sp li').length}function mk(t,z){const li=document.createElement('li');li.innerText=t;if(z)li.classList.add('zach');li.onclick=function(){li.classList.toggle('zach')};document.getElementById('sp').appendChild(li);br()}function dob(){const i=document.getElementById('p');const t=i.value.trim();if(t==''){return}mk(t);i.value=''}function pre(){document.querySelectorAll('#sp li.zach').forEach(function(e){e.remove()});br()}mk('Мляко');mk('Хляб',true);mk('Сирене');<\/script>`},
9:{t:"Анкета за екскурзия",h:560,c:`<form onsubmit="return false" style="font-family:Arial;margin:12px;line-height:2"><h2 style="margin:0">Анкета: училищна екскурзия</h2><label>Име: <input type="text" required></label><br><label>Възраст: <input type="number" style="width:70px"></label> <label>Имейл: <input type="email"></label><br>Транспорт: <label><input type="radio" name="t" checked> автобус</label> <label><input type="radio" name="t"> влак</label><br>Дейности: <label><input type="checkbox" checked> разходка</label> <label><input type="checkbox"> музей</label> <label><input type="checkbox"> игри</label><br><label>Град: <select><option>Велико Търново</option><option>Пловдив</option><option>Варна</option></select></label><br><textarea rows="3" cols="36" placeholder="Коментар"></textarea><br><button type="submit">Изпрати</button></form>`},
21:{t:"Пътеписен блог",h:430,c:`<style>body{font-family:Arial;margin:0}header,nav,main,aside,footer{padding:10px 16px}header{background:#dbeafe}nav{background:#e0f2fe}nav a{margin-right:14px;color:#1e40af}#glavno{background:#fef9c3}.pateshestvie{background:#dcfce7;border:1px solid #86efac;border-radius:8px;padding:8px 12px;margin:8px 0}.sred{display:flex;align-items:stretch}.sred main{flex:1}aside{background:#fae8ff;width:30%;flex:none}footer{background:#e2e8f0;font-size:.85rem}</style><header><h1 style="margin:0">Пътувам и пиша</h1><p style="margin:4px 0">Дневник от моите пътувания</p></header><nav><a href="#">Начало</a><a href="#">Пътувания</a><a href="#">За мен</a></nav><div class="sred"><main id="glavno"><section><h2>Последни пътувания</h2><article class="pateshestvie"><h3>Седемте рилски езера</h3><p>Преход с много стълби, но гледката си заслужава.</p></article><article class="pateshestvie"><h3>Уикенд в Пловдив</h3><p>Кукерите, Старият град и страхотен сладолед.</p></article></section></main><aside><b>Последни публикации</b><br>• Седемте рилски езера<br>• Уикенд в Пловдив</aside></div><footer>© 2026 Петя Иванова</footer>`},
22:{t:"Мета тагове и DOM",h:330,c:`<div id="d" style="font-family:Arial;margin:12px"><p>Първият абзац в div-а.</p><p>Вторият абзац в div-а.</p><ul><li>Първи</li><li>Втори</li><li>Трети</li></ul></div><div style="font-family:Arial;margin:12px"><button onclick="pk()">Покажи информация за дървото</button><p id="r" style="font-weight:bold;color:#1e3a8a"></p></div><script>function pk(){const d=document.getElementById('d');const p=d.querySelector('p');document.getElementById('r').innerText='Родител на първия абзац: '+p.parentElement.tagName+' | Деца на div-а: '+d.children.length}<\/script>`}
};

function pvInit(k){const p=PV[k],f=document.getElementById("pvx");if(p&&f)f.srcdoc='<meta charset="UTF-8"><body style="margin:0;padding:0">'+p.c}
function taskHTML(k){
  const t=TASKS[k];if(!t)return"";
  const ext=t.f.split(".").pop();
  return `<h3>💻 Задача за Notepad++</h3><div class="task"><p class="tt">${t.g}</p><ol>${t.s.map(x=>`<li>${x}</li>`).join("")}</ol>${t.b?`<p class="tb">⭐ <b>Бонус:</b> ${t.b}</p>`:""}${PVall(k)}<p class="tf">📁 Запази като: <code>${t.f}</code></p><details><summary>Как да работя в Notepad++?</summary>${HOW[ext]}</details></div>`;
}

{t:"Формуляри",
 body:`<p><code>&lt;form&gt;</code> събира данни от потребителя – регистрация, анкета, поръчка. Всяко поле е <code>&lt;input&gt;</code>, а видът му се определя от атрибута <code>type</code>.</p>

<div class="fig"><svg class="w" viewBox="0 0 520 280" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="8" width="270" height="262" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="24" y="36" font-size="16" fill="#1c2333" font-weight="bold" text-anchor="start" >Регистрация</text><text x="24" y="62" font-size="12.5" fill="#566073" text-anchor="start" >Име:</text><rect x="24" y="68" width="238" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="34" y="86" font-size="12.5" fill="#94a3b8" text-anchor="start" >Въведи име</text><text x="24" y="116" font-size="12.5" fill="#566073" text-anchor="start" >Клас:</text><rect x="24" y="122" width="238" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/><text x="34" y="140" font-size="12.5" fill="#1c2333" text-anchor="start" >12 А</text><text x="246" y="140" font-size="14" fill="#1c2333" >▾</text><text x="24" y="172" font-size="12.5" fill="#566073" text-anchor="start" >Връзка с мен:</text><circle cx="34" cy="188" r="7" fill="#fff" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="34" cy="188" r="3.5" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="48" y="192" font-size="12.5" fill="#1c2333" text-anchor="start" >имейл</text><circle cx="120" cy="188" r="7" fill="#fff" stroke="#3a5a8c" stroke-width="1.5"/><text x="134" y="192" font-size="12.5" fill="#1c2333" text-anchor="start" >телефон</text><rect x="27" y="208" width="14" height="14" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="34" y="220" font-size="12" fill="#166534" font-weight="bold" >✓</text><text x="50" y="220" font-size="12.5" fill="#1c2333" text-anchor="start" >Съгласен съм</text><rect x="24" y="232" width="110" height="30" rx="8" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="79" y="252" font-size="13" fill="#fff" font-weight="bold" >Изпрати</text><line x1="340" y1="81" x2="293.0" y2="81.0" stroke="#dc2626" stroke-width="1.6"/><polygon points="284.0,81.0 293.0,76.0 293.0,86.0" fill="#dc2626"/><text x="346" y="85" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >input type=&quot;text&quot;</text><line x1="340" y1="135" x2="293.0" y2="135.0" stroke="#d97706" stroke-width="1.6"/><polygon points="284.0,135.0 293.0,130.0 293.0,140.0" fill="#d97706"/><text x="346" y="139" font-size="12" fill="#d97706" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >&lt;select&gt;</text><line x1="340" y1="188" x2="293.0" y2="188.0" stroke="#7c3aed" stroke-width="1.6"/><polygon points="284.0,188.0 293.0,183.0 293.0,193.0" fill="#7c3aed"/><text x="346" y="192" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >input type=&quot;radio&quot;</text><line x1="340" y1="215" x2="293.0" y2="215.0" stroke="#16a34a" stroke-width="1.6"/><polygon points="284.0,215.0 293.0,210.0 293.0,220.0" fill="#16a34a"/><text x="346" y="219" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >input type=&quot;checkbox&quot;</text><line x1="340" y1="247" x2="293.0" y2="247.0" stroke="#1d4ed8" stroke-width="1.6"/><polygon points="284.0,247.0 293.0,242.0 293.0,252.0" fill="#1d4ed8"/><text x="346" y="251" font-size="12" fill="#1d4ed8" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >button type=&quot;submit&quot;</text></svg><small>Така изглежда формата и кой таг отговаря за всяка част от нея</small></div>
<table class="t"><tr><th>Елемент</th><th>Какво прави</th></tr>
<tr><td><code>&lt;input type="text"&gt;</code></td><td>текстово поле</td></tr>
<tr><td><code>type="email"</code>, <code>"password"</code>, <code>"number"</code></td><td>имейл, парола (скрити знаци), число</td></tr>
<tr><td><code>type="checkbox"</code> / <code>"radio"</code></td><td>отметка (може няколко) / избор на един вариант</td></tr>

<tr><td><code>&lt;button type="submit"&gt;</code></td><td>бутон за изпращане</td></tr></table>
<div class="box"><b>label</b> – надпис към полето; свързва се с него чрез <code>for="ime"</code> и <code>id="ime"</code>.<br><code>placeholder</code> – подсказка в полето, <code>required</code> – задължително поле. Радио бутоните от една група имат еднакво <code>name</code>.</div>
<p><b>Опитай:</b> добави поле за телефон (<code>type="tel"</code>) и направи имейла задължителен.</p>`,
 code:`<form onsubmit="event.preventDefault();document.getElementById('o').innerText='Здравей, '+document.getElementById('ime').value+'!'">
