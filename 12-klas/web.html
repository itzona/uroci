{t:"CSS: Flexbox – подреждане на елементи",
 body:`<p><b>Flexbox</b> подрежда елементите в ред или колона и разпределя свободното място. Включва се на <b>контейнера</b> с <code>display:flex;</code>, а елементите вътре се подреждат по него.</p>

<div class="fig"><svg class="w" viewBox="0 0 510 298" font-family="Arial" font-size="14" text-anchor="middle"><text x="8" y="49" font-size="12.5" fill="#3a5a8c" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >flex-start</text><rect x="150" y="16" width="340" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><rect x="158" y="24" width="34" height="34" rx="6" fill="#fecaca" stroke="#64748b" stroke-width="1"/><text x="175" y="47" font-size="14" fill="#1c2333" font-weight="bold" >1</text><rect x="198" y="24" width="34" height="34" rx="6" fill="#fde68a" stroke="#64748b" stroke-width="1"/><text x="215" y="47" font-size="14" fill="#1c2333" font-weight="bold" >2</text><rect x="238" y="24" width="34" height="34" rx="6" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><text x="255" y="47" font-size="14" fill="#1c2333" font-weight="bold" >3</text><text x="8" y="111" font-size="12.5" fill="#3a5a8c" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >center</text><rect x="150" y="78" width="340" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><rect x="263" y="86" width="34" height="34" rx="6" fill="#fecaca" stroke="#64748b" stroke-width="1"/><text x="280" y="109" font-size="14" fill="#1c2333" font-weight="bold" >1</text><rect x="303" y="86" width="34" height="34" rx="6" fill="#fde68a" stroke="#64748b" stroke-width="1"/><text x="320" y="109" font-size="14" fill="#1c2333" font-weight="bold" >2</text><rect x="343" y="86" width="34" height="34" rx="6" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><text x="360" y="109" font-size="14" fill="#1c2333" font-weight="bold" >3</text><text x="8" y="173" font-size="12.5" fill="#3a5a8c" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >space-between</text><rect x="150" y="140" width="340" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><rect x="158" y="148" width="34" height="34" rx="6" fill="#fecaca" stroke="#64748b" stroke-width="1"/><text x="175" y="171" font-size="14" fill="#1c2333" font-weight="bold" >1</text><rect x="303" y="148" width="34" height="34" rx="6" fill="#fde68a" stroke="#64748b" stroke-width="1"/><text x="320" y="171" font-size="14" fill="#1c2333" font-weight="bold" >2</text><rect x="448" y="148" width="34" height="34" rx="6" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><text x="465" y="171" font-size="14" fill="#1c2333" font-weight="bold" >3</text><text x="8" y="235" font-size="12.5" fill="#3a5a8c" font-weight="bold" text-anchor="start" font-family="Consolas,monospace" >space-around</text><rect x="150" y="202" width="340" height="50" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><rect x="187" y="210" width="34" height="34" rx="6" fill="#fecaca" stroke="#64748b" stroke-width="1"/><text x="204" y="233" font-size="14" fill="#1c2333" font-weight="bold" >1</text><rect x="303" y="210" width="34" height="34" rx="6" fill="#fde68a" stroke="#64748b" stroke-width="1"/><text x="320" y="233" font-size="14" fill="#1c2333" font-weight="bold" >2</text><rect x="419" y="210" width="34" height="34" rx="6" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><text x="436" y="233" font-size="14" fill="#1c2333" font-weight="bold" >3</text><line x1="150" y1="268" x2="481.0" y2="268.0" stroke="#566073" stroke-width="2"/><polygon points="490.0,268.0 481.0,273.0 481.0,263.0" fill="#566073"/><text x="320" y="288" font-size="12" fill="#566073" >главна ос (при flex-direction: row)</text></svg><small>justify-content разпределя елементите по главната ос</small></div>
<table class="t"><tr><th>Свойство</th><th>Стойности</th><th>Ефект</th></tr>
<tr><td><code>flex-direction</code></td><td>row, column</td><td>в ред или в колона</td></tr>
<tr><td><code>justify-content</code></td><td>flex-start, center, space-between, space-around</td><td>подредба по главната ос (при row – хоризонтално)</td></tr>
<tr><td><code>align-items</code></td><td>flex-start, center, stretch</td><td>подредба по другата ос (вертикално)</td></tr>
<tr><td><code>gap</code></td><td>10px</td><td>разстояние между елементите</td></tr>
<tr><td><code>flex-wrap</code></td><td>wrap</td><td>елементите минават на нов ред, когато не им стига място</td></tr>
<tr><td><code>flex</code> (на елемента)</td><td>1</td><td>елементът заема свободното място</td></tr></table>
<div class="box">Типични приложения: хоризонтално меню в <code>nav</code>, карти една до друга, центриране на съдържание с <code>justify-content:center; align-items:center;</code>.</div>
<p><b>Опитай:</b> смени <code>space-between</code> с <code>center</code>, после <code>row</code> с <code>column</code>.</p>`,
 code:`<style>
 .red { display:flex; flex-direction:row; justify-content:space-between;
        align-items:center; gap:10px; height:110px;
        background:#eef2ff; padding:10px; border-radius:10px; }
 .red div { background:#3a5a8c; color:#fff; padding:14px 18px; border-radius:8px; }
 .red .shirok { flex:1; text-align:center; background:#f59e0b; }
</style>
<div class="red">
  <div>1</div>
  <div class="shirok">2 – заема остатъка</div>
  <div>3</div>
</div>`,
 quiz:[Q("С какво се включва Flexbox?","display:flex на контейнера",["flex:on на елемента","position:flex"],"Контейнерът получава display:flex.",1),
 Q("Кое свойство центрира елементите по главната ос?","justify-content",["align-text","gap"],"justify-content управлява главната ос, align-items – другата.",2),
 Q("Какво прави gap?","Задава разстояние между елементите",["Прави рамка","Сменя цвета"],"gap е празното място между flex елементите.",0)]},

{t:"CSS: адаптивен дизайн, преходи и анимации",
 body:`<p>Сайтът трябва да изглежда добре на компютър, таблет и телефон – това е <b>адаптивен (responsive) дизайн</b>.</p>
<table class="t"><tr><th>Правило</th><th>Как се прави</th></tr>
<tr><td>Viewport</td><td>В head: <code>&lt;meta name="viewport" content="width=device-width, initial-scale=1"&gt;</code> – без него телефонът смалява цялата страница.</td></tr>
<tr><td>Гъвкави мерки</td><td>Проценти, <code>rem</code>, <code>max-width:100%</code> за картинките, вместо фиксирани px.</td></tr>
<tr><td>Media query</td><td><code>@media (max-width:600px) { … }</code> – правилата важат само при екран до 600px.</td></tr></table>

<div class="fig"><svg class="w" viewBox="0 0 520 218" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="20" width="250" height="150" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="8" y="20" width="250" height="18" rx="8" fill="#cbd5e1" stroke="#475569" stroke-width="2"/><rect x="16" y="44" width="234" height="18" rx="4" fill="#c7d2fe" stroke="#6366f1" stroke-width="1"/><rect x="16" y="68" width="74" height="90" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="96" y="68" width="74" height="90" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="176" y="68" width="74" height="90" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><text x="133" y="190" font-size="13" fill="#1c2333" font-weight="bold" >💻 Компютър</text><text x="133" y="206" font-size="12" fill="#566073" >3 колони</text><rect x="284" y="36" width="120" height="134" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="292" y="46" width="104" height="14" rx="4" fill="#c7d2fe" stroke="#6366f1" stroke-width="1"/><rect x="292" y="66" width="50" height="50" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="346" y="66" width="50" height="50" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="292" y="122" width="104" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><text x="344" y="190" font-size="13" fill="#1c2333" font-weight="bold" >📱 Таблет</text><text x="344" y="206" font-size="12" fill="#566073" >2 колони</text><rect x="430" y="56" width="70" height="114" rx="12" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="436" y="64" width="58" height="12" rx="3" fill="#c7d2fe" stroke="#6366f1" stroke-width="1"/><rect x="436" y="82" width="58" height="24" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="436" y="110" width="58" height="24" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><rect x="436" y="138" width="58" height="24" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/><text x="465" y="190" font-size="13" fill="#1c2333" font-weight="bold" >📲 Телефон</text><text x="465" y="206" font-size="12" fill="#566073" >1 колона</text><text x="133" y="12" font-size="10.5" fill="#64748b" font-weight="normal" font-family="Consolas,monospace" >@media (min-width:900px)</text></svg><small>Един и същ сайт променя подредбата си според ширината на екрана</small></div>
<h3>Плавни промени и анимации</h3>
<table class="t"><tr><th>Свойство</th><th>Ефект</th></tr>
<tr><td><code>transition: .3s;</code></td><td>промяната (напр. при <code>:hover</code>) става плавно</td></tr>
<tr><td><code>transform: scale(1.06);</code></td><td>уголемява, завърта (<code>rotate</code>) или мести (<code>translate</code>)</td></tr>
<tr><td><code>@keyframes</code> + <code>animation</code></td><td>самостоятелна анимация на етапи</td></tr></table>
<div class="box">Подход „първо телефон“: пишеш стиловете за малък екран, а с media query добавяш подредбата за по-големите.</div>
<p><b>Опитай:</b> прегледът е тесен, затова фонът се оцветява. Смени <code>350px</code> на <code>100px</code> и виж разликата.</p>`,
 code:`<style>
 .gal { display:flex; flex-wrap:wrap; gap:10px; }
 .k { flex:1 1 110px; padding:20px; background:#3a5a8c; color:#fff;
      border-radius:10px; text-align:center; transition:.3s; }
 .k:hover { background:#f59e0b; transform:scale(1.06); }
 @media (max-width:350px) { body { background:#fee2e2; } }
 @keyframes puls { 50% { opacity:.3; } }
 .zv { animation:puls 1.5s infinite; }
</style>
<p class="zv">● Анимиран текст</p>
<div class="gal">
  <div class="k">Карта 1</div><div class="k">Карта 2</div><div class="k">Карта 3</div>

{t:"JavaScript: DOM и събития – малка апликация",

dasharray="4"/><text x="410" y="123" font-size="14" fill="#1c2333" font-weight="bold" font-family="Consolas,monospace" >li</text><text x="250" y="160" font-size="12" fill="#1c2333" >Хляб</text><text x="330" y="160" font-size="12" fill="#1c2333" >Мляко</text><text x="410" y="160" font-size="12" fill="#16a34a" font-weight="bold" >Сирене</text><text x="455" y="82" font-size="12.5" fill="#16a34a" font-weight="bold" >ново!</text><text x="330" y="186" font-size="11" fill="#166534" font-weight="normal" font-family="Consolas,monospace" >createElement(&quot;li&quot;) + appendChild(li)</text></svg><small>Когато JavaScript добави нов елемент в дървото, той веднага се появява на страницата</small></div>

 code:`<style>
 li { cursor:pointer; }
 .gotovo { text-decoration:line-through; color:gray; }
</style>
<input id="z" placeholder="Нова задача">
<button onclick="dobavi()">Добави</button>
<ul id="sp"></ul>
<p id="br"></p>
<script>
  function dobavi() {
    const t = document.getElementById("z").value.trim();
    if (t == "") return;
    const li = document.createElement("li");
    li.innerText = t;
    li.onclick = function () { li.classList.toggle("gotovo"); broi(); };
    document.getElementById("sp").appendChild(li);
    document.getElementById("z").value = "";
    broi();
  }
  function broi() {
    const o = document.querySelectorAll("li:not(.gotovo)").length;
    document.getElementById("br").innerText = "Оставащи задачи: " + o;
  }
<\/script>`,

{t:"Планиране и задание за уеб сайт",
 body:`<p>Планирането е <b>първата стъпка</b> към успешен сайт. Определя темата, целта, целевата група, съдържанието и функционалността.</p>
<table class="t"><tr><th>Стъпка</th><th>Въпрос</th><th>Пример</th></tr>
<tr><td>Тема</td><td>Каква е основната идея?</td><td>пекарна, училищен клуб, туристическа агенция</td></tr>
<tr><td>Цел</td><td>Какво искаме да постигнем?</td><td>да информираме, продаваме, представим дейност</td></tr>
<tr><td>Целева група</td><td>За кого е сайтът?</td><td>ученици, туристи</td></tr>
<tr><td>Конкуренция</td><td>Какви подобни сайтове има?</td><td>какво им липсва и как можем да сме по-удобни</td></tr>
<tr><td>Съдържание</td><td>Каква информация и как е подредена?</td><td>„Контакти“: адрес, карта, форма за запитвания</td></tr>
<tr><td>Изисквания</td><td>Какво ще може потребителят?</td><td>коментари, абонамент, онлайн поръчки</td></tr></table>
<div class="box">Успешният сайт е ясен и четлив, <b>адаптивен</b> (вижда се добре на различни устройства), бърз и сигурен, с интуитивна навигация, добро съдържание и дизайн, оптимизиран за търсачки.</div>

"216" y="245" font-size="19" fill="#1c2333" >📋</text><text x="234" y="243" font-size="12.5" fill="#1c2333" font-weight="bold" text-anchor="start" >Съдържание</text><rect x="366" y="194" width="128" height="44" rx="22" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/><text x="386" y="223" font-size="19" fill="#1c2333" >⚙️</text><text x="404" y="221" font-size="12.5" fill="#1c2333" font-weight="bold" text-anchor="start" >Изисквания</text></svg><small>Планирането започва с въпроси – всеки клон е стъпка в заданието</small></div>
<h3>Задание за уеб сайт</h3>
<p><b>Заданието</b> е документ, който описва изискванията, нуждите и очакванията към бъдещия сайт. Изготвя се след определяне на целта и е „картата“ за следващите етапи. Трябва да е ясно, кратко, на разбираем език и с конкретни, измерими цели.</p>
<p>То съдържа: обща информация (име, описание, вид); цели и целева група; основно съдържание; основни страници; изисквания; административни бележки (срокове, домейн, хостинг).</p>
<h3>Избор на име (домейн)</h3>
<p>Името е свързано с темата, кратко и лесно за запомняне и не се ползва от друга фирма. Дали е свободно, се проверява при регистратор: <b>register.bg</b> (за .bg) или Cloudflare Domains (за .com, .net, .org). Регистрира се срещу <b>годишна такса</b> за определен срок. Българското име се транслитерира: „Сладки моменти“ → <code>sladkimomenti</code>.</p>

0" height="26" rx="13" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="83" y="126" font-size="11.5" fill="#166534" font-weight="bold" >👉 домейнът: sladkarnitsa.bg</text></svg><small>Анатомия на уеб адрес: домейнът е „адресът на къщата“, а хостингът – самата къща</small></div>

{t:"Проектиране: архитектура, структура, навигация",
 body:`<p>Проектирането е етапът <b>след планирането</b>. То определя как ще изглежда сайтът и как ще бъде организиран.</p>
<table class="t"><tr><th>Стъпка</th><th>Какво представлява</th></tr>
<tr><td>Архитектура</td><td>структурна рамка: какви страници има и как са свързани</td></tr>
<tr><td>Схема (Wireframe)</td><td>чертеж на страница без цветове и дизайн – подредба на съдържанието</td></tr>
<tr><td>Графичен модел (Mockup)</td><td>визуален модел с цветове, изображения и шрифтове</td></tr>
<tr><td>Прототип (Prototype)</td><td>интерактивен модел – показва как ще работи сайтът</td></tr></table>
<h3>Архитектура, структура, навигация</h3>
<table class="t"><tr><th>Понятие</th><th>Значение</th></tr>
<tr><td>Архитектура</td><td>„скелетът“ на сайта – логическата йерархия, какви страници и функции има</td></tr>
<tr><td>Структура</td><td>подредбата на страниците и връзките между тях; рисува се като блок-схема</td></tr>
<tr><td>Навигация</td><td>пътищата и елементите за придвижване – менюта, бутони, линкове</td></tr></table>
<h3>Видове структури</h3>
<table class="t"><tr><th>Структура</th><th>Как е устроена</th><th>Подходяща за</th></tr>
<tr><td>Йерархична</td><td>главната страница е на върха, под нея раздели и подстраници</td><td>сайтове с много страници</td></tr>
<tr><td>Линейна</td><td>страниците са в последователен ред</td><td>малки сайтове</td></tr>
<tr><td>Мрежова</td><td>всяка страница може да е свързана с всяка</td><td>големи, силно свързани проекти</td></tr>
<tr><td>Хибридна</td><td>комбинира другите видове</td><td>големи сайтове с различни раздели</td></tr></table>

"/><line x1="490" y1="78" x2="500" y2="120" stroke="#64748b" stroke-width="1.5"/><line x1="440" y1="120" x2="470" y2="120" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3"/><line x1="470" y1="120" x2="500" y2="120" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3"/><circle cx="455" cy="36" r="9" fill="#fde68a" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="420" cy="78" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="490" cy="78" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="410" cy="120" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="440" cy="120" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="470" cy="120" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/><circle cx="500" cy="120" r="9" fill="#a5f3fc" stroke="#3a5a8c" stroke-width="1.5"/></svg><small>Четирите вида структура на сайт – всеки кръг е една страница</small></div>
<p>Пример за йерархична структура на училищен сайт:</p>
<pre>Начало
 ├─ Учебна дейност
 │    └─ Учебни програми

 └─ Контакти</pre>
<p>При голям сайт се прави и <b>карта на сайта</b> (sitemap) – страница със списък от линкове към всички страници. Блок-схемата може да се нарисува безплатно на <b>app.diagrams.net</b>.</p>
<h3>Видове навигация</h3>
<p><b>Главна</b> – основното меню горе; <b>вътрешна</b> – в рамките на раздел; <b>странична</b> (sidebar) – категории и филтри; <b>футър</b> – допълнителни линкове долу; <b>бутонна/линкова</b> – води към действия и свързани теми.</p>
<div class="box"><b>Правила:</b> главно меню с най-важните страници; менютата са на едно и също място; линковете се наименуват кратко и ясно. Добри практики: кратки имена на файлове и папки, подпапки за различното съдържание.</div>
<p><b>Задача:</b> начертай структурата на своя проект и реши коя от четирите структури е най-подходяща.</p>`,

 Q("Коя структура е най-разпространена?","Йерархична (пирамидална)",["Линейна","Мрежова"],"Главната страница е на върха, под нея са разделите.",0),
 Q("За какво се използва блок-схема при структурата?","За визуализиране на връзките между страниците",["За избор на цветове","За качване на сайта"],"Блок-схемата показва как са свързани страниците.",2),
 Q("Къде е главната навигация?","Основното меню в горната част на страницата",["Само във футъра","В отделен файл"],"Главното меню води към основните страници.",1),
 Q("Какво е sitemap?","Страница със списък от линкове към всички страници",["Вид шрифт","Рамка на изображение"],"Карта на сайта помага на потребителите и на търсачките.",0)]},

{t:"Схема на уеб страница (wireframe) и достъпност",
 body:`<p>При проектирането на една страница се минава през три стъпки: <b>събиране и анализ на информация</b> (какво ще съдържа), <b>схематичен дизайн (wireframe)</b> и <b>графичен модел</b>. Целта е страниците да са удобни, визуално привлекателни и да работят на различни устройства.</p>
<p><b>Wireframe</b> е структурен план на страницата – основата на графичния модел. Показва какви елементи има, как са подредени и как са свързани секциите. Прави се със софтуер (напр. <b>excalidraw.com</b>) или на хартия.</p>
<div class="fig" style="text-align:left"><div style="border:2px dashed #94a3b8;border-radius:8px;padding:8px;font:12px Arial;max-width:420px;margin:0 auto;color:#475569">
<div style="display:flex;justify-content:space-between;border:1px solid #94a3b8;padding:6px;margin-bottom:6px"><span style="border:1px solid #94a3b8;padding:2px 10px">✕ лого</span><span>Меню</span></div>
<div style="border:1px solid #94a3b8;padding:20px 0;text-align:center;margin-bottom:6px">✕ изображение (Hero)<br><span style="border:1px solid #94a3b8;padding:1px 8px;display:inline-block;margin-top:6px">Бутон</span></div>
<div style="display:flex;gap:6px;margin-bottom:6px">${[1,2,3].map(i=>`<div style="flex:1;border:1px solid #94a3b8;padding:14px 0;text-align:center">Маршрут ${i}</div>`).join("")}</div>
<div style="display:flex;justify-content:space-between;border:1px solid #94a3b8;padding:6px"><span>Контакти</span><span>Авторски права</span></div></div><small>Wireframe на начална страница: header, hero, основно съдържание, footer</small></div>
<table class="t"><tr><th>Елемент</th><th>Какво съдържа</th></tr>
<tr><td>Хедър (Header)</td><td>най-горната част: лого, навигация, търсачка</td></tr>
<tr><td>„Hero“ секция</td><td>първото, което виждаш: заглавие, кратко представяне, бутон</td></tr>
<tr><td>Основно съдържание</td><td>по-подробна информация в секции: текст, изображения, видеа</td></tr>
<tr><td>Футър (Footer)</td><td>най-долната част: контакти, социални мрежи, авторски права</td></tr></table>
<h3>Достъпност (Web Accessibility)</h3>
<p>Достъпността позволява сайтът да се ползва и от хора с увреждания. Основни принципи: <b>алтернативен текст</b> (<code>alt</code>) на изображенията; <b>контрастни цветове</b> за четимост; управление само с клавиатура; ясни шрифтове и големи бутони.</p>

<div class="fig"><svg class="w" viewBox="0 0 520 166" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="8" width="160" height="148" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="88" y="30" font-size="13" fill="#1c2333" font-weight="bold" >Добър контраст</text><rect x="22" y="44" width="132" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="70" font-size="12.5" fill="#1e293b" font-weight="bold" >Четеш се лесно</text><rect x="22" y="96" width="132" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="80" y="122" font-size="12.5" fill="#d4d4d8" >Едва се чете…</text><text x="146" y="70" font-size="13" fill="#1c2333" text-anchor="end" >✅</text><text x="146" y="122" font-size="13" fill="#1c2333" text-anchor="end" >❌</text><rect x="184" y="8" width="160" height="148" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="264" y="30" font-size="13" fill="#1c2333" font-weight="bold" >Алтернативен текст</text><rect x="224" y="42" width="80" height="48" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/><text x="264" y="74" font-size="28" fill="#1c2333" >🏫</text><text x="264" y="108" font-size="11" fill="#c2410c" font-weight="normal" font-family="Consolas,monospace" >alt=&quot;Сградата</text><text x="264" y="122" font-size="11" fill="#c2410c" font-weight="normal" font-family="Consolas,monospace" >на училището&quot;</text><text x="264" y="146" font-size="11" fill="#566073" >🔊 прочита се на глас</text><rect x="360" y="8" width="152" height="148" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="436" y="30" font-size="13" fill="#1c2333" font-weight="bold" >Само с клавиатура</text><rect x="386" y="50" width="100" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="436" y="78" font-size="17" fill="#1c2333" font-weight="bold" >Tab ⇥</text><rect x="386" y="100" width="100" height="28" rx="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="3"/><text x="436" y="119" font-size="13" fill="#1c2333" font-weight="bold" >Бутон</text><text x="436" y="146" font-size="10.5" fill="#566073" >видим фокус върху бутона</text></svg><small>Достъпният сайт е удобен за всички – включително за хора със зрителни или двигателни затруднения</small></div>
<h3>Типове уеб страници</h3>
<p><b>Начална</b> – представя сайта и води към разделите; <b>продуктова</b> – информация, снимки и бутони за покупка или запитване; <b>контактна</b> – форма, адрес, имейл, карта; <b>новини</b> – публикации и събития. Вътрешните страници следват стила и логиката на началната.</p>
<p><b>Задача:</b> нарисувай wireframe на началната страница на своя проект.</p>`,
 code:null,
 quiz:[Q("Какво показва wireframe?","Подредбата на елементите на страницата",["Готовия код","Цената на хостинга"],"Wireframe е чертеж на страницата без цветове и дизайн.",1),
 Q("Коя е първата секция, която потребителят вижда на началната страница?","Hero секцията",["Футърът","Картата на сайта"],"Hero има заглавие, кратко представяне и бутон.",2),
 Q("Какво е полезно за достъпността на снимките?","Алтернативен текст (alt)",["По-малък размер","Рамка"],"alt описва изображението на хора, които не го виждат.",0),
 Q("Какво обикновено има във футъра?","Контакти и авторски права",["Главното меню и hero","Само снимки"],"Футърът съдържа контакти, социални мрежи и авторски права.",1),
 Q("Каква е ролята на контрастните цветове?","Подобряват четимостта",["Ускоряват сайта","Намаляват файла"],"Добрият контраст прави текста по-лесен за четене.",2)]},

{t:"Графичен модел (mockup) и графичен дизайн",
 body:`<p><b>Графичен модел (mockup)</b> е статично и детайлно визуално представяне на сайта – показва как ще изглежда крайният дизайн. <b>Прототипът</b> е интерактивен модел: може да се кликва и да се отварят менюта.</p>
<table class="t"><tr><th>Mockup</th><th>Prototype</th></tr><tr><td>показва само външния вид</td><td>позволява взаимодействие със сайта</td></tr></table>

<div class="fig"><svg class="w" viewBox="0 0 520 210" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="14" width="140" height="150" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="16" y="22" width="124" height="16" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><text x="78" y="34" font-size="9.5" fill="#94a3b8" >лого        меню</text><rect x="16" y="44" width="124" height="44" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><line x1="16" y1="44" x2="140" y2="88" stroke="#cbd5e1" stroke-width="1"/><line x1="140" y1="44" x2="16" y2="88" stroke="#cbd5e1" stroke-width="1"/><rect x="16" y="94" width="38" height="34" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><rect x="58" y="94" width="38" height="34" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><rect x="100" y="94" width="38" height="34" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><rect x="16" y="134" width="124" height="22" rx="3" fill="#fff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3"/><rect x="190" y="14" width="140" height="150" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="198" y="22" width="124" height="16" rx="3" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="214" y="34" font-size="11" fill="#1c2333" >☕</text><text x="290" y="34" font-size="10" fill="#fff" font-weight="bold" >Меню</text><rect x="198" y="44" width="124" height="44" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/><text x="260" y="72" font-size="10" fill="#7c2d12" font-weight="bold" >🍰 Свежо всеки ден</text><rect x="198" y="94" width="38" height="34" rx="3" fill="#fde68a" stroke="#64748b" stroke-width="1"/><rect x="240" y="94" width="38" height="34" rx="3" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><rect x="282" y="94" width="38" height="34" rx="3" fill="#fbcfe8" stroke="#64748b" stroke-width="1"/><rect x="198" y="134" width="124" height="22" rx="3" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/><text x="260" y="149" font-size="10" fill="#fff" >Контакти</text><rect x="372" y="14" width="140" height="150" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="380" y="22" width="124" height="16" rx="3" fill="#3a5a8c" stroke="#3a5a8c" stroke-width="1.5"/><text x="396" y="34" font-size="11" fill="#1c2333" >☕</text><text x="472" y="34" font-size="10" fill="#fff" font-weight="bold" >Меню</text><rect x="380" y="44" width="124" height="44" rx="3" fill="#fed7aa" stroke="#f97316" stroke-width="1.5"/><text x="442" y="72" font-size="10" fill="#7c2d12" font-weight="bold" >🍰 Свежо всеки ден</text><rect x="380" y="94" width="38" height="34" rx="3" fill="#fde68a" stroke="#64748b" stroke-width="1"/><rect x="422" y="94" width="38" height="34" rx="3" fill="#bbf7d0" stroke="#64748b" stroke-width="1"/><rect x="464" y="94" width="38" height="34" rx="3" fill="#fbcfe8" stroke="#64748b" stroke-width="1"/><rect x="380" y="134" width="124" height="22" rx="3" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/><text x="442" y="149" font-size="10" fill="#fff" >Контакти</text><rect x="422" y="94" width="38" height="34" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="2"/><text x="451" y="128" font-size="20" fill="#1c2333" >👆</text><text x="78" y="184" font-size="14" fill="#1c2333" font-weight="bold" >Wireframe</text><text x="78" y="200" font-size="12" fill="#566073" >само подредба</text><text x="260" y="184" font-size="14" fill="#1c2333" font-weight="bold" >Mockup</text><text x="260" y="200" font-size="12" fill="#566073" >цветове и снимки</text><text x="442" y="184" font-size="14" fill="#1c2333" font-weight="bold" >Prototype</text><text x="442" y="200" font-size="12" fill="#566073" >може да се кликва</text><line x1="152" y1="90" x2="177.0" y2="90.0" stroke="#6366f1" stroke-width="2.5"/><polygon points="186.0,90.0 177.0,95.0 177.0,85.0" fill="#6366f1"/><line x1="334" y1="90" x2="359.0" y2="90.0" stroke="#6366f1" stroke-width="2.5"/><polygon points="368.0,90.0 359.0,95.0 359.0,85.0" fill="#6366f1"/></svg><small>От чертеж до жив модел: всяка стъпка добавя повече детайли</small></div>
<h3>Етапи при създаване на графичен модел</h3>
<p>1) цветова схема; 2) шрифтове; 3) изображения – празните места от wireframe се заместват с реални снимки, икони, графики; 4) финално оформление – лого, разпределяне на компонентите и обсъждане с екипа и клиента.</p>
<h3>Цветова схема</h3>
<p>Дизайнерите използват не повече от <b>3–4 цвята</b>: основен (главният), вторичен (акценти, бутони), третичен (допълва другите) и неутрални (фон и текст).</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">${SW('#2f4a73','основен',1)}${SW('#f59e0b','вторичен')}${SW('#8fb3d9','третичен')}${SW('#f7f8fa','неутрален')}</div>
<p>Видове схеми по цветовото колело: <b>аналогични</b> (цветове един до друг), <b>допълващи се</b> (един срещу друг, контрастни) и <b>монохромни</b> (тонове на един цвят). Палитра може да се генерира на <b>mycolor.space</b>.</p>

<div class="fig"><svg class="w" viewBox="0 0 530 178" font-family="Arial" font-size="14" text-anchor="middle"><text x="8" y="30" font-size="13.5" fill="#1c2333" font-weight="bold" text-anchor="start" >Аналогични</text><text x="8" y="46" font-size="11.5" fill="#566073" text-anchor="start" >съседни цветове</text><rect x="150" y="8" width="86" height="44" rx="8" fill="#2563eb" stroke="#fff" stroke-width="0"/><rect x="242" y="8" width="86" height="44" rx="8" fill="#0891b2" stroke="#fff" stroke-width="0"/><rect x="334" y="8" width="86" height="44" rx="8" fill="#0d9488" stroke="#fff" stroke-width="0"/><rect x="426" y="8" width="86" height="44" rx="8" fill="#16a34a" stroke="#fff" stroke-width="0"/><text x="8" y="86" font-size="13.5" fill="#1c2333" font-weight="bold" text-anchor="start" >Допълващи се</text><text x="8" y="102" font-size="11.5" fill="#566073" text-anchor="start" >един срещу друг</text><rect x="150" y="64" width="86" height="44" rx="8" fill="#2563eb" stroke="#fff" stroke-width="0"/><rect x="242" y="64" width="86" height="44" rx="8" fill="#93c5fd" stroke="#fff" stroke-width="0"/><rect x="334" y="64" width="86" height="44" rx="8" fill="#fdba74" stroke="#fff" stroke-width="0"/><rect x="426" y="64" width="86" height="44" rx="8" fill="#f97316" stroke="#fff" stroke-width="0"/><text x="8" y="142" font-size="13.5" fill="#1c2333" font-weight="bold" text-anchor="start" >Монохромни</text><text x="8" y="158" font-size="11.5" fill="#566073" text-anchor="start" >тонове на един цвят</text><rect x="150" y="120" width="86" height="44" rx="8" fill="#1e3a8a" stroke="#fff" stroke-width="0"/><rect x="242" y="120" width="86" height="44" rx="8" fill="#2563eb" stroke="#fff" stroke-width="0"/><rect x="334" y="120" width="86" height="44" rx="8" fill="#60a5fa" stroke="#fff" stroke-width="0"/><rect x="426" y="120" width="86" height="44" rx="8" fill="#bfdbfe" stroke="#fff" stroke-width="0"/></svg><small>Три начина да подберем цветове, които си „пасват“</small></div>
<h3>Шрифтове (типография)</h3>
<p>Ползват се не повече от 2–3 шрифта. <span style="font-family:Georgia,serif;font-size:1.1em">Серифните (Serif)</span> имат допълнителни елементи и се ползват за основни текстове; <span style="font-family:Arial,sans-serif;font-size:1.1em">несерифните (Sans-Serif)</span> са без тях. Комбинации се подбират на <b>fontjoy.com</b>.</p>
<h3>Подредба и секции</h3>
<p><b>Секциите</b> са отделните визуални блокове на страницата, а <b>подредбата</b> е композицията – как са разположени.</p>
<h3>Лого и бранд идентичност</h3>
<p><b>Логото</b> е графичен знак на организацията – текстово, символно или комбинирано; прави марката разпознаваема. <b>Бранд идентичността</b> е цялостният визуален стил: цветова палитра, шрифтове, лого и вариации, икони и графични елементи, стил на изображенията. Правилата се описват в <b>бранд бук</b>.</p>
<p><b>Задача:</b> избери палитра от 3–4 цвята и 2 шрифта за проекта си и направи mockup на началната страница в excalidraw.com.</p>`,
 code:null,
 quiz:[Q("Каква е разликата между mockup и prototype?","Mockup показва външния вид, prototype позволява интеракция",["Няма разлика","Prototype е само чертеж на хартия"],"Графичният модел е статичен, прототипът е интерактивен.",1),
 Q("Колко цвята ползват обикновено дизайнерите?","Не повече от 3–4",["Поне 10","Само един"],"Малко цветове правят дизайна хармоничен.",0),
 Q("Кои цветове са „допълващи се“?","Тези, които са един срещу друг в колелото",["Тези един до друг","Тонове на един цвят"],"Допълващите се цветове са контрастни.",2),
 Q("За какво са серифните шрифтове?","Обикновено за основни текстове",["Само за логота","За фона"],"Serif шрифтовете имат допълнителни графични елементи.",1),
 Q("Какво е бранд идентичност?","Цялостният визуален стил на марката",["Само логото","Адресът на сайта"],"Включва палитра, шрифтове, лого, икони и стил на изображенията.",0)]}
);

L.push(
{t:"Уеб технологии, стандарти и как работи интернет",
 body:`<p><b>Уеб технологиите</b> са езици и инструменти за създаване на сайтове. Основните са три: <b>HTML</b> – какво има на страницата, <b>CSS</b> – как изглежда, <b>JavaScript</b> – как се държи.</p>
<table class="t"><tr><th>Технология</th><th>Роля</th><th>Пример</th></tr>
<tr><td>HTML</td><td>маркиращ език за структурата и съдържанието (не е програмен език!)</td><td><code>&lt;h1&gt;Добре дошли!&lt;/h1&gt;</code></td></tr>
<tr><td>CSS</td><td>отделя външния вид от съдържанието; прилага стилове чрез селектори</td><td><code>h1 { color: blue; }</code></td></tr>
<tr><td>JavaScript</td><td>програмен език за интерактивност – реагира на клик, въвеждане, променя съдържанието</td><td><code>button.onclick = function() {…}</code></td></tr></table>
<h3>Организация и достъп до уеб съдържание</h3>
<p><b>Хипертекстът</b> е текст с връзки към други ресурси, а <b>хипервръзката</b> е елементът, върху който се кликва. Страниците се съхраняват на <b>уеб сървър</b> (компютър или софтуер, напр. Apache, Nginx), който приема заявките на браузъра и изпраща страниците. Обменът върви по протокол <b>HTTP/HTTPS</b>.</p>
<div class="box"><b>Как работи интернет (клиент – сървър):</b><br>1) въвеждаш адрес (URL) в браузъра; 2) браузърът праща HTTP заявка към сървъра; 3) сървърът връща HTML, CSS и други файлове; 4) браузърът показва сайта.</div>

<div class="fig"><svg class="w" viewBox="0 0 520 192" font-family="Arial" font-size="14" text-anchor="middle"><rect x="8" y="40" width="130" height="120" rx="14" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/><text x="73" y="86" font-size="36" fill="#1c2333" >💻</text><text x="73" y="116" font-size="15" fill="#1c2333" font-weight="bold" >Браузър</text><text x="73" y="134" font-size="12.5" fill="#566073" >(клиент)</text><rect x="382" y="40" width="130" height="120" rx="14" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="447" y="86" font-size="36" fill="#1c2333" >🗄️</text><text x="447" y="116" font-size="15" fill="#1c2333" font-weight="bold" >Сървър</text><text x="447" y="134" font-size="12.5" fill="#566073" >(хостинг)</text><line x1="146" y1="78" x2="365.0" y2="78.0" stroke="#d97706" stroke-width="2.5"/><polygon points="374.0,78.0 365.0,83.0 365.0,73.0" fill="#d97706"/><text x="260" y="58" font-size="13.5" fill="#92400e" font-weight="bold" >① HTTP заявка</text><text x="260" y="72" font-size="11.5" fill="#92400e" >„дай ми sladkarnitsa.bg“</text><line x1="374" y1="124" x2="155.0" y2="124.0" stroke="#16a34a" stroke-width="2.5"/><polygon points="146.0,124.0 155.0,119.0 155.0,129.0" fill="#16a34a"/><text x="260" y="148" font-size="13" fill="#166534" font-weight="bold" >② отговор: HTML, CSS, JS, снимки</text><text x="260" y="180" font-size="13" fill="#3a5a8c" font-weight="bold" >③ браузърът сглобява и показва страницата</text></svg><small>Така работи интернет: заявка → отговор → показване</small></div>
<h3>Уеб стандарти</h3>
<p>Стандартите са правила и препоръки, които осигуряват еднакво показване в различните браузъри и подобряват достъпността и сигурността. Разработва ги <b>W3C</b> (World Wide Web Consortium). <b>HTML5</b> е създаден през 2008 г. и потвърден от W3C през 2014 г. <b>CSS3</b> се развива на модули, а след 2020 г. W3C спира да номерира версиите на CSS.</p>
<h3>Софтуер за създаване на сайтове</h3>
<p><b>Текстови редактори</b> (пишеш код): Visual Studio Code, Notepad++. <b>Визуални редактори</b> (без код, с графичен интерфейс): WordPress, Wix.</p>
<h3>Анализ на страница с Developer Tools</h3>
<p>Натисни <b>F12</b> (или десен бутон → Inspect) върху всеки сайт, например bg.wikipedia.org. В таба <b>Elements</b> се вижда HTML структурата, в <b>Styles</b> – CSS стиловете, а в <b>Network</b> – заявките към сървъра.</p>
<p><b>Опитай:</b> в примера по-долу HTML създава елемента, CSS задава вида и ефекта при посочване, а JavaScript – реакцията при клик.</p>`,
 code:`<style>
 #box { width:200px; height:100px; background-color:lightblue; text-align:center;
        line-height:100px; font-weight:bold; cursor:pointer; }
 #box:hover { background-color:orange; }
</style>
<div id="box">Натисни ме</div>
<script>
  document.getElementById("box").onclick = function () {
    this.style.backgroundColor = "green";
    this.innerHTML = "Здрасти!";
  };
<\/script>`,
 quiz:[Q("Коя технология описва външния вид на страницата?","CSS",["HTML","HTTP"],"HTML е структурата, CSS – визията, JavaScript – поведението.",1),
 Q("Кое е вярно за HTML?","Маркиращ език е, не е програмен език",["Програмен език е","Служи само за анимации"],"HTML описва съдържанието с тагове.",0),
 Q("Какво връща сървърът на браузъра?","HTML, CSS и други файлове",["Само снимки","Нищо – всичко е в браузъра"],"Браузърът праща HTTP заявка, а сървърът връща файловете на сайта.",2),
 Q("Коя организация разработва уеб стандартите?","W3C",["HTTP","Apache"],"World Wide Web Consortium е основната организация за уеб стандарти.",1),
 Q("Кой е визуален редактор за сайтове?","WordPress",["Notepad++","Visual Studio Code"],"Визуалните редактори (WordPress, Wix) работят без писане на код.",0)]},

{t:"Авторски права и лицензи",
 body:`<p>Публичната информация в интернет може да се използва, но трябва да спазваме правила – те са в <b>Закона за авторското право</b> и се определят от всяка държава.</p>
<table class="t"><tr><th>Обекти на авторско право</th><th>Изключения</th></tr>
<tr><td>литературни произведения, статии, компютърни програми, музика, графични изображения, проекти</td><td>закони и други административни актове, актуални новини, факти</td></tr></table>
<p>Защитените произведения се разпознават по символа <b>©</b> (от „copyright“), най-често в долния край на произведението.</p>
<h3>Creative Commons</h3>
<p><b>Creative Commons</b> е нетърговска организация с безплатни публични лицензи, които определят правата и задълженията на потребителите. Обозначенията: <b>BY</b> – посочва се авторът; <b>NC</b> – само нетърговска употреба; <b>ND</b> – без преработка; <b>SA</b> – споделяне при същите условия.</p>

<div class="fig"><svg class="w" viewBox="0 0 520 148" font-family="Arial" font-size="14" text-anchor="middle"><circle cx="64" cy="56" r="38" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="64" y="70" font-size="40" fill="#3b82f6" font-weight="bold" >👤</text><text x="64" y="118" font-size="15" fill="#1c2333" font-weight="bold" >CC BY</text><text x="64" y="136" font-size="12.5" fill="#566073" >Посочи автора</text><circle cx="194" cy="56" r="38" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="194" y="70" font-size="40" fill="#dc2626" font-weight="bold" >$</text><line x1="166" y1="84" x2="222" y2="28" stroke="#dc2626" stroke-width="4"/><text x="194" y="118" font-size="15" fill="#1c2333" font-weight="bold" >CC NC</text><text x="194" y="136" font-size="12.5" fill="#566073" >Без печалба</text><circle cx="324" cy="56" r="38" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="324" y="70" font-size="40" fill="#d97706" font-weight="bold" >＝</text><text x="324" y="118" font-size="15" fill="#1c2333" font-weight="bold" >CC ND</text><text x="324" y="136" font-size="12.5" fill="#566073" >Без промени</text><circle cx="454" cy="56" r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="454" y="70" font-size="40" fill="#16a34a" font-weight="bold" >↻</text><text x="454" y="118" font-size="15" fill="#1c2333" font-weight="bold" >CC SA</text><text x="454" y="136" font-size="12.5" fill="#566073" >Същия лиценз</text></svg><small>Четирите „кубчета“, от които се състоят лицензите Creative Commons</small></div>
<table class="t"><tr><th>Лиценз</th><th>Позволява</th><th>Трябва</th></tr>
<tr><td>CC BY</td><td>споделяне, промяна, печалба</td><td>да се спомене авторът</td></tr>
<tr><td>CC BY-SA</td><td>споделяне, промяна, печалба</td><td>автор и същия лиценз</td></tr>
<tr><td>CC BY-ND</td><td>споделяне, печалба</td><td>автор, без промени</td></tr>
<tr><td>CC BY-NC</td><td>споделяне, промяна</td><td>автор, без печалба</td></tr>
<tr><td>CC BY-NC-SA</td><td>споделяне, промяна</td><td>автор, същия лиценз, без печалба</td></tr>
<tr><td>CC BY-NC-ND</td><td>само споделяне</td><td>автор, без промени, без печалба</td></tr></table>
<h3>Софтуерни лицензи</h3>
<p><b>GNU GPL</b> гарантира на потребителите да ползват програмата за всякаква цел, да изучават как работи, да я променят и да разпространяват копия. С GPL са Linux, Firefox, Inkscape, GIMP и Audacity. Други масови лицензи: <b>MIT</b> (максимално свободен), <b>Apache 2.0</b> (комерсиално ползване с упоменаване на автор и лиценз), <b>Mozilla Public License 2.0</b> (промените по файловете остават публични).</p>
<div class="box">За проекта: снимките и шрифтовете, които ползваш, трябва да са твои или с подходящ лиценз. Запиши източника и лиценза във футъра или в отделна страница.</div>`,
 code:null,
 quiz:[Q("Кой символ показва, че произведение е защитено?","©",["®","#"],"© идва от „copyright“ – авторско право.",1),
 Q("Какво означава NC в Creative Commons?","Само за нетърговска употреба",["Без преработка","Нужно е споделяне"],"NC = non-commercial.",0),
 Q("Какво НЕ е обект на авторско право?","Актуални новини и факти",["Компютърна програма","Музикално произведение"],"Законите, актуалните новини и фактите са изключения.",2),
 Q("Какво означава BY във всеки CC лиценз?","Трябва да се посочи авторът",["Забранена е промяна","Забранена е печалба"],"BY = attribution – споменаване на автора.",1),
 Q("Кой от изброените продукти е с GPL?","Firefox",["Windows","Photoshop"],"Linux, Firefox, GIMP, Inkscape и Audacity са с GPL.",0)]},

{t:"HTML: контейнери и семантична структура",
 body:`<p><code>&lt;div&gt;</code> е контейнер за групиране на елементи. За групиране се ползват и атрибутите: <code>id</code> – уникален идентификатор, и <code>class</code> – обща група от няколко елемента.</p>
<pre>&lt;h2 id="contacts"&gt;Контакти&lt;/h2&gt;
&lt;p class="text"&gt;Първи параграф&lt;/p&gt;
&lt;p class="text"&gt;Втори параграф&lt;/p&gt;</pre>
<h3>Семантичен HTML</h3>
<p>Семантичните тагове имат <b>значение</b> – показват каква е ролята на частта от страницата, а не само как изглежда.</p>

<div class="fig"><svg class="w" viewBox="0 0 540 228" font-family="Arial" font-size="14" text-anchor="middle"><text x="130" y="18" font-size="14" fill="#566073" font-weight="bold" >Само &lt;div&gt;</text><rect x="10" y="28" width="240" height="34" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="50.0" font-size="13" fill="#64748b" font-weight="bold" font-family="Consolas,monospace" >&lt;div&gt;</text><rect x="10" y="68" width="240" height="20" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="83.0" font-size="13" fill="#64748b" font-weight="bold" font-family="Consolas,monospace" >&lt;div&gt;</text><rect x="10" y="94" width="240" height="70" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="134.0" font-size="13" fill="#64748b" font-weight="bold" font-family="Consolas,monospace" >&lt;div&gt;</text><rect x="10" y="170" width="240" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="130" y="190.0" font-size="13" fill="#64748b" font-weight="bold" font-family="Consolas,monospace" >&lt;div&gt;</text><text x="130" y="218" font-size="11.5" fill="#566073" >не се разбира коя част за какво е</text><line x1="260" y1="120" x2="279.0" y2="120.0" stroke="#6366f1" stroke-width="3"/><polygon points="288.0,120.0 279.0,125.0 279.0,115.0" fill="#6366f1"/><text x="414" y="18" font-size="14" fill="#166534" font-weight="bold" >Семантични тагове</text><rect x="296" y="28" width="236" height="34" rx="4" fill="#c7d2fe" stroke="#6366f1" stroke-width="1.5"/><text x="414" y="50" font-size="13" fill="#3730a3" font-weight="bold" font-family="Consolas,monospace" >&lt;header&gt;</text><rect x="296" y="68" width="236" height="22" rx="4" fill="#a5f3fc" stroke="#0891b2" stroke-width="1.5"/><text x="414" y="84" font-size="13" fill="#155e75" font-weight="bold" font-family="Consolas,monospace" >&lt;nav&gt;</text><rect x="296" y="96" width="160" height="70" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="376" y="126" font-size="13" fill="#166534" font-weight="bold" font-family="Consolas,monospace" >&lt;main&gt;</text><text x="376" y="144" font-size="11" fill="#166534" font-weight="normal" font-family="Consolas,monospace" >&lt;article&gt;</text><rect x="462" y="96" width="70" height="70" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/><text x="497" y="136" font-size="12" fill="#92400e" font-weight="bold" font-family="Consolas,monospace" >&lt;aside&gt;</text><rect x="296" y="172" width="236" height="28" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="414" y="191" font-size="13" fill="#991b1b" font-weight="bold" font-family="Consolas,monospace" >&lt;footer&gt;</text><text x="414" y="218" font-size="11.5" fill="#166534" >всяка част има ясна роля</text></svg><small>Семантичният HTML помага на търсачките, екранните четци и на теб самия</small></div>
<table class="t"><tr><th>Таг</th><th>Роля</th></tr>
<tr><td><code>&lt;header&gt;</code></td><td>уводно съдържание: заглавие, лого, меню</td></tr>
<tr><td><code>&lt;nav&gt;</code></td><td>навигационно меню – връзки към части или други страници</td></tr>
<tr><td><code>&lt;main&gt;</code></td><td>основното, най-важно съдържание</td></tr>
<tr><td><code>&lt;section&gt;</code></td><td>разделя съдържанието на секции, групира свързано съдържание</td></tr>
<tr><td><code>&lt;article&gt;</code></td><td>самостоятелно съдържание – новина, статия</td></tr>
<tr><td><code>&lt;aside&gt;</code></td><td>допълнителна информация в страничната лента</td></tr>
<tr><td><code>&lt;footer&gt;</code></td><td>най-долната част: контакти, авторство, права</td></tr></table>
<div class="box">Тези тагове съответстват на частите от wireframe: header, hero и основно съдържание, footer. Така кодът следва проектираната структура.</div>
<p><b>Опитай:</b> добави втори <code>&lt;article&gt;</code> и още един елемент в <code>&lt;nav&gt;</code>.</p>`,
 code:`<header>
  <h1>Моят сайт</h1>
  <p>Кратко представяне на сайта.</p>
</header>
<nav>
  <a href="#">Начало</a> | <a href="#">За нас</a> | <a href="#">Контакти</a>
</nav>
<main>
  <section>
    <h2>Добре дошли!</h2>
    <p>Това е началната страница на нашия сайт.</p>
  </section>
  <article>
    <h3>Нов курс по HTML</h3>
    <p>Започва през следващия месец.</p>
  </article>
  <aside>
    <h3>Новини</h3>
    <ul><li>Безплатен уъркшоп за начинаещи</li></ul>
  </aside>
</main>
<footer>
  <p>© 2026 Моят сайт. Всички права запазени.</p>
</footer>`,
 quiz:[Q("Кой таг съдържа основното съдържание на страницата?","<main>",["<aside>","<footer>"],"main съдържа най-важната информация.",1),
 Q("Кой таг е за самостоятелна новина или статия?","<article>",["<nav>","<header>"],"article е самостоятелно съдържание.",2),
 Q("Кой атрибут е уникален за един елемент?","id",["class","href"],"Класът групира много елементи, id е само за един.",0),
 Q("Къде се поставят контактите и правата?","<footer>",["<header>","<aside>"],"Футърът е най-долната част на страницата.",1),
 Q("Кой таг е за допълнителна информация в страничната лента?","<aside>",["<main>","<section>"],"aside може да съдържа новини, реклами, архивни връзки.",0)]},

{t:"HTML: мета тагове и HTML дървото (DOM)",
 body:`<p><b>Мета таговете</b> се поставят в <code>&lt;head&gt;</code>, съдържат информация за страницата и не се визуализират директно.</p>
<table class="t"><tr><th>Мета таг</th><th>За какво служи</th></tr>
<tr><td><code>&lt;meta charset="UTF-8"&gt;</code></td><td>кодиране – как се изобразяват символите (кирилицата)</td></tr>
<tr><td><code>&lt;meta name="description" content="…"&gt;</code></td><td>кратко описание; ползва се от търсачките</td></tr>
<tr><td><code>&lt;meta name="author" content="…"&gt;</code></td><td>автор на страницата</td></tr>
<tr><td><code>&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;</code></td><td>правилно показване на телефон</td></tr></table>
<h3>HTML дърво (DOM)</h3>

function drag(el,fn,start){
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();const s=start(),x0=e.clientX,y0=e.clientY;
    el.setPointerCapture(e.pointerId);document.body.classList.add("dragging");
    const mv=ev=>fn(ev.clientX-x0,ev.clientY-y0,s);
    const up=()=>{document.body.classList.remove("dragging");el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up)};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
}

const CH=(t,bg,lab)=>`<div style="text-align:center"><div style="background:${bg};padding:10px 12px;border-radius:8px;white-space:pre">${t}</div>${lab?`<div style="width:1px;height:18px;background:#94a3b8;margin:6px auto 0"></div><div style="font:400 12.5px Inter,Arial,sans-serif;color:#566073;margin-top:4px">${lab}</div>`:""}</div>`;
L[23]={t:"Оформление с атрибута style",
 body:`<p>В темата за таблиците оцветявахме редове и клетки с <code>style</code>. Този атрибут може да се сложи на <b>всеки таг</b> – така му задаваш цвят, подравняване, размер на буквите, рамка и още много. Това е <b>вграден CSS</b> (inline CSS): оформлението е написано директно в тага и важи <b>само за него</b>. Целият CSS ще учим по-нататък в темата „CSS – стилове и цветове“.</p>

<h3>Как се пише style</h3>
<p>В отварящия таг се добавя атрибутът <code>style="…"</code>. Вътре се пишат двойки <code>свойство: стойност;</code> – колкото искаш, една след друга.</p>
<div class="fig"><div style="display:flex;justify-content:center;flex-wrap:wrap;gap:6px;align-items:flex-start;font:700 20px/1 var(--mono);color:#1c2333">${CH("&lt;p","#c7d2fe","таг")}${CH('style="',"#fde68a","атрибут")}${CH("color","#bbf7d0","свойство")}${CH(":","transparent","")}${CH("red","#fecaca","стойност")}${CH(";","transparent","")}${CH('"&gt;',"#e2e8f0","")}</div><small>свойство и стойност се делят с „:“, а свойствата помежду си – с „;“</small></div>
<pre>&lt;p style="color:red; text-align:center; font-size:22px;"&gt;Здравей!&lt;/p&gt;</pre>
<div class="box"><b>Правила:</b> между свойството и стойността стои <b>двоеточие</b> <code>:</code>, а между две свойства – <b>точка и запетая</b> <code>;</code>. Всички свойства са вътре в <b>един чифт кавички</b>. Названията са на английски и се пишат с тире, например <code>background-color</code>.</div>

<h3>Цвят на текста и на фона</h3>
<ul class="tg"><li><code>color</code><span>цвят на текста</span><span class="r" style="color:#dc2626;border-color:#fca5a5">Червен текст</span></li><li><code>background-color</code><span>цвят на фона</span><span class="r" style="background:#fde68a;border-color:#fde68a">Жълт фон</span></li></ul>
<p>Цветът се задава с име (<code>red</code>), с HEX код (<code>#fde68a</code>) или с <code>rgb(…)</code> – същите цветове, които вече видяхме при таблиците. Следи за <b>контраст</b>: <span style="background:#fde68a;color:#facc15;padding:1px 8px;border-radius:3px">жълто на жълто</span> не се чете, а <span style="background:#fde68a;color:#92400e;padding:1px 8px;border-radius:3px">кафяво на жълто</span> се чете лесно.</p>

<h3>Фон на цялата страница</h3>
<p>Ако сложиш <code>style</code> на тага <code>&lt;body&gt;</code>, оформлението важи за цялата страница:</p>
<pre>&lt;body style="background-color:#fef9c3; color:#1e293b;"&gt;</pre>

<h3>Подравняване на текст – text-align</h3>
<table class="t"><tr><th>Стойност</th><th>Значение</th></tr><tr><td>left</td><td>отляво (по подразбиране)</td></tr><tr><td>center</td><td>в средата</td></tr><tr><td>right</td><td>отдясно</td></tr><tr><td>justify</td><td>двустранно – и двата края на редовете са изравнени, както във вестник</td></tr></table>
<div style="max-width:420px;margin:14px 0"><div style="background:#dff1ff;padding:6px 10px;margin:4px 0;text-align:left">left – текстът е отляво</div><div style="background:#dff1ff;padding:6px 10px;margin:4px 0;text-align:center">center – текстът е в средата</div><div style="background:#dff1ff;padding:6px 10px;margin:4px 0;text-align:right">right – текстът е отдясно</div><div style="background:#dff1ff;padding:6px 10px;margin:4px 0;text-align:justify">justify – при дълъг текст двата края на редовете се изравняват, а разстоянията между думите се разпределят равномерно по целия ред.</div></div>
<pre>&lt;h1 style="text-align:center;"&gt;Заглавие&lt;/h1&gt;
&lt;p style="text-align:right;"&gt;Текст отдясно&lt;/p&gt;</pre>
<div class="box">Старият начин е атрибутът <code>align="center"</code>. Още работи (виж заглавието на този сайт), но е остарял – в нови страници ползвай <code>text-align</code>.</div>

<h3>Шрифт и вид на текста</h3>
<ul class="tg"><li><code>font-size</code><span>размер на буквите (в px)</span><span class="r" style="font-size:24px">24px</span></li><li><code>font-family</code><span>шрифт</span><span class="r" style="font-family:Georgia,serif">Georgia</span></li><li><code>font-weight</code><span>дебелина: bold или normal</span><span class="r"><b>bold</b></span></li><li><code>font-style</code><span>наклонен текст: italic</span><span class="r"><i>italic</i></span></li><li><code>text-decoration</code><span>underline, line-through или none</span><span class="r"><u>underline</u></span></li><li><code>text-transform</code><span>uppercase, lowercase, capitalize</span><span class="r" style="text-transform:uppercase">главни</span></li><li><code>line-height</code><span>разстояние между редовете</span><span class="r" style="line-height:1.9">ред 1<br>ред 2</span></li></ul>

<h3>Рамка, отстъпи и ширина</h3>
<ul class="tg"><li><code>border</code><span>рамка: дебелина, вид, цвят</span><span class="r" style="border:2px solid #3a5a8c;border-radius:6px">2px solid #3a5a8c</span></li><li><code>padding</code><span>вътрешен отстъп – между текста и рамката</span><span class="r" style="padding:12px">padding:12px</span></li><li><code>margin</code><span>външен отстъп – около елемента</span></li><li><code>width</code><span>ширина – в px или в %</span></li></ul>

<div class="fig"><div style="display:inline-block;background:#fed7aa;border:2px dashed #f97316;border-radius:6px;padding:8px 36px 20px;font:700 14px Arial;color:#9a3412"><div style="margin-bottom:6px">margin – външен отстъп</div><div style="background:#fde68a;border:5px solid #3a5a8c;padding:6px 26px 18px;color:#3a5a8c"><div style="margin-bottom:6px">border – рамка</div><div style="background:#bbf7d0;padding:6px 26px 18px;color:#166534"><div style="margin-bottom:8px">padding – вътрешен отстъп</div><div style="background:#fff;border:1px solid #94a3b8;padding:14px 22px;color:#1c2333;font-weight:400">текст (съдържание)</div></div></div></div><small>Всеки елемент е „кутия“: съдържание → padding → border → margin</small></div>
<div class="box">За да центрираш <b>самия блок</b> (а не текста в него), му задай ширина и автоматичен външен отстъп:<br><code>style="width:60%; margin:0 auto;"</code>.</div>

<h3>Пример: всичко заедно</h3>
<p>Три тага, оформени само с <code>style</code>:</p>
<pre>&lt;h2 style="background-color:#3a5a8c; color:white; text-align:center; padding:10px;"&gt;Кафене „Роси“&lt;/h2&gt;
&lt;p style="text-align:justify; font-size:18px; line-height:1.6;"&gt;
  Най-хубавото кафе в града, прясно изпечени кифлички и уютна градина.
&lt;/p&gt;
&lt;p style="text-align:right; color:#92400e; font-style:italic;"&gt;
  Работим всеки ден от 8 до 20 часа.
&lt;/p&gt;</pre>
<p>Така изглежда резултатът:</p>
<div style="max-width:540px;border:1px solid var(--line-strong);border-radius:10px;padding:14px;background:#fff"><h2 style="background-color:#3a5a8c;color:white;text-align:center;padding:10px;margin:0 0 10px;border:0;font-size:1.5rem">Кафене „Роси“</h2><p style="text-align:justify;font-size:18px;line-height:1.6;margin:0 0 10px">Най-хубавото кафе в града, прясно изпечени кифлички и уютна градина.</p><p style="text-align:right;color:#92400e;font-style:italic;margin:0">Работим всеки ден от 8 до 20 часа.</p></div>

<h3>Наследяване и чести грешки</h3>
<div class="box"><b>Наследяване:</b> <code>color</code>, <code>font-…</code> и <code>text-align</code> се предават на тагове, вложени вътре. Ако сложиш <code>text-align:center</code> на <code>&lt;body&gt;</code>, всичко в страницата се центрира. <code>border</code>, <code>padding</code> и <code>margin</code> не се предават – важат само за тага, на който са зададени.<br><b>Приоритет:</b> ако <code>body</code> е със <code>color:blue</code>, а един абзац – с <code>color:red</code>, абзацът е червен. Печели по-вътрешният таг.</div>
<table class="t"><tr><th>Грешно</th><th>Правилно</th><th>Какво е сгрешено</th></tr>
<tr><td>style="color=red"</td><td>style="color:red"</td><td>двоеточие, не равно</td></tr>
<tr><td>style="color:red font-size:20px"</td><td>style="color:red; font-size:20px"</td><td>липсва „;“ между свойствата</td></tr>
<tr><td>style="font-size:20 px"</td><td>style="font-size:20px"</td><td>без интервал между числото и px</td></tr>
<tr><td>style="text-align:centre"</td><td>style="text-align:center"</td><td>пише се center (американски правопис)</td></tr>
<tr><td>style="backgroundcolor:red"</td><td>style="background-color:red"</td><td>липсва тире</td></tr></table>
<p><b>Опитай:</b> в редактора по-долу смени цвета на фона в <code>body</code>, центрирай адреса, подравни телефона вдясно и сложи рамка на работното време. После нарочно махни някой „;“ и виж какво се случва.</p>`,
 raw:true,
 code:`<body style="font-family:Arial; background-color:#fef9c3; color:#1e293b;">
<h1 style="text-align:center; color:#1e3a8a;">Моето училище</h1>

 quiz:[Q("Кой запис на style е правилен?",'style="color:red; font-size:20px;"',['style="color=red, font-size=20px"','style="color:red font-size:20px"'],"Свойство и стойност се делят с „:“, а свойствата помежду си – с „;“.",1),
 Q("Кое оформление центрира текста в абзац?","text-align:center",["align-text:middle","text-center:yes"],"text-align подравнява текста: left, center, right или justify.",0),
 Q("Body е със color:blue, а един абзац – с color:red. Какъв е цветът на абзаца?","Червен – печели по-вътрешният таг",["Син – body е по-важен","Лилав – цветовете се смесват"],"Оформлението на самия таг е с по-голям приоритет от наследеното.",2)]};

PV[23]={t:"Моята визитка",h:520,bn:true,c:`<body style="margin:0;padding:32px 40px;background:#fffbeb;color:#292524;font-family:Arial"><h1 style="text-align:center;background:#3a5a8c;color:#fff;padding:20px;font-size:34px;margin:0 0 22px">Моята визитка</h1><p style="text-align:justify;line-height:1.6;margin:0 0 18px">Казвам се Мария и уча в 11. клас. Обичам информатиката, особено когато от няколко реда код се появява цяла страница. Мечтая един ден да правя сайтове и приложения.</p><p style="text-align:right;font-style:italic;margin:0 0 18px">Хобита: плуване, фотография и разходки в планината.</p><hr style="margin:0 0 22px"><p style="width:60%;margin:0 auto;box-sizing:border-box;border:2px solid #3a5a8c;padding:16px;background:#e0e7ff;text-transform:uppercase;text-align:center">Контакти: maria@example.com · тел. 02 123 456</p></body>`};

L[24]={t:"Аудио и видео в HTML",
 body:`<p>С HTML5 можеш да вмъкнеш звук и видео в страницата без допълнителни програми – браузърът има вграден плейър. За целта има два тага: <code>&lt;audio&gt;</code> за звук и <code>&lt;video&gt;</code> за видео. Файловете се пазят в папката на сайта и се посочват като картинките – с <code>src</code>.</p>

<h3>Таг audio – звук</h3>
<pre>&lt;audio controls src="zvuk.mp3"&gt;&lt;/audio&gt;</pre>
<p>Така изглежда в браузъра (бутон за пускане, лента за превъртане и сила на звука):</p>
<div class="fig" style="text-align:left"><audio controls src="${SAMPLE_MP3}" style="width:100%;max-width:420px"></audio></div>

<h3>Таг video – видео</h3>
<pre>&lt;video controls width="320" poster="kartinka.png" src="klip.mp4"&gt;&lt;/video&gt;</pre>
<div class="fig"><video controls width="320" poster="${PVimg('#7dd3fc','#15803d')}" src="${SAMPLE_MP4}" style="max-width:100%;border-radius:8px"></video><small>Преди да натиснеш „пусни“, се вижда картинката от <code>poster</code></small></div>

<h3>Важни атрибути</h3>
<ul class="tg"><li><code>controls</code><span>показва бутоните за управление</span><span class="r">▶ ━━○ 🔊</span></li><li><code>autoplay</code><span>започва сам при зареждане</span><span class="r">▶ сам</span></li><li><code>loop</code><span>повтаря се отначало</span><span class="r">🔁</span></li><li><code>muted</code><span>започва без звук</span><span class="r">🔇</span></li><li><code>preload</code><span>какво да се зареди предварително: none, metadata, auto</span></li><li><code>poster</code><span>картинка, докато видеото не е пуснато (само за video)</span><span class="r">🖼️</span></li><li><code>width</code> <code style="min-width:0">height</code><span>размер на видеото (само за video)</span></li></ul>
<div class="box"><b>Внимание:</b> повечето браузъри не пускат автоматично видео със звук. Ако искаш <code>autoplay</code>, го комбинирай с <code>muted</code>. Без <code>controls</code> потребителят няма как да пусне или спре файла.</div>

<h3>Няколко формата с source</h3>
<p>Не всеки браузър поддържа всеки формат. Затова вместо <code>src</code> можеш да подредиш няколко тага <code>&lt;source&gt;</code> – браузърът взема първия, който може да пусне. Текстът най-отдолу се вижда само ако няма поддръжка:</p>
<pre>&lt;video controls width="320"&gt;
  &lt;source src="klip.mp4" type="video/mp4"&gt;
  &lt;source src="klip.webm" type="video/webm"&gt;
  Браузърът ти не поддържа видео.
&lt;/video&gt;

&lt;audio controls&gt;
  &lt;source src="zvuk.mp3" type="audio/mpeg"&gt;
  &lt;source src="zvuk.ogg" type="audio/ogg"&gt;
  Браузърът ти не поддържа аудио.
&lt;/audio&gt;</pre>
<table class="t"><tr><th>Вид</th><th>Формат</th><th>Стойност на type</th></tr>
<tr><td>Аудио</td><td>MP3</td><td>audio/mpeg</td></tr>
<tr><td>Аудио</td><td>WAV</td><td>audio/wav</td></tr>
<tr><td>Аудио</td><td>OGG</td><td>audio/ogg</td></tr>
<tr><td>Видео</td><td>MP4 (H.264)</td><td>video/mp4</td></tr>
<tr><td>Видео</td><td>WebM</td><td>video/webm</td></tr>
<tr><td>Видео</td><td>OGG</td><td>video/ogg</td></tr></table>
<div class="box"><b>Съвет:</b> <b>MP3</b> и <b>MP4</b> се пускат във всички съвременни браузъри и обикновено са достатъчни. Държи файловете малки – големите забавят зареждането на сайта. Ползвай само свои материали или такива с позволяващ лиценз.</div>

<h3>Видео от друг сайт</h3>
<p>Ако видеото е в YouTube, не е нужно да го качваш при себе си – вмъква се с <code>&lt;iframe&gt;</code> (вграден прозорец към друга страница), като адресът е от „Споделяне → Вграждане“:</p>
