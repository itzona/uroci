 {t:'Матрица',q:'Матрица с тегла: полезност ×3, лекота ×1. Идея А има оценка 4 за полезност и 2 за лекота. Колко точки събира?',o:['6','10','14','24'],c:2,e:'Умножаваме оценка × тегло и събираме: 4 × 3 = 12, 2 × 1 = 2, 12 + 2 = 14. Отговорът 6 е само сборът от оценките – без теглата.'},

function mtH(){const n=mta.filter(x=>x!==undefined).length,ok=mta.filter((x,i)=>x===MT[i].c).length;
 let h=`<div class="card"><h2>✅ Мини-тест: готови ли сте за щаба?</h2><p>6 кратки ситуации. Отговорът се проверява веднага. При <b>поне 5 от 6</b> верни получавате значка <b>„Готов за Кризисния щаб“</b>.</p><div class="pg"><i style="width:${n/6*100}%"></i></div><p class="hint">Отговорени: ${n} / 6 · Верни: ${ok}</p>`;
 MT.forEach((q,i)=>{const a=mta[i],d=a!==undefined;h+=`<div class="it"><b>${i+1}. <span class="ch">${q.t}</span> ${q.q}</b>${q.o.map((o,k)=>`<button class="op ${d&&k==q.c?'oy':''} ${d&&k==a&&a!=q.c?'ox':''}" ${d?'disabled':''} onclick="mtA(${i},${k})">${d&&k==q.c?'✓ ':d&&k==a?'✗ ':''}${o}</button>`).join('')}${d?`<div class="${a==q.c?'t':'d'}">${a==q.c?'✅ <b>Вярно!</b>':'❌ <b>Не съвсем.</b> Верният отговор е маркиран в зелено.'} ${q.e}</div>`:''}</div>`});
 if(n==6)h+=ok>=5?`<div style="text-align:center;margin:18px 0"><div class="badge"><b>🎖</b><span>Готов за Кризисния щаб<br><small>${ok} / 6 верни</small></span></div><p><button class="go" onclick="go(-1)">🎮 Към играта</button> <button onclick="mta=[];draw()">🔁 Реши отново</button></p></div>`:`<div class="d" style="margin-top:14px"><b>${ok} / 6 верни.</b> За значката трябват поне 5. Прочети обясненията или се върни към 📚 Теория и опитай пак.</div><p><button class="go" onclick="mta=[];draw();scrollTo(0,0)">🔁 Опитай пак</button> <button onclick="go(-2)">📚 Към теорията</button></p>`;
 return h+'</div>'}

 {t:'Факти и мнения',i:'🔍',txt:'Анализаторът подрежда казаното в две колони на таблото. Фактът може да се провери (график, разписание), а мнението – не.',who:[['Борис','🔍 Анализатор','„Кое можем да докажем и кое само усещаме?“'],['Мими','📣 Говорител','„В понеделник ще сме уморени.“ – Борис: „Това е мнение, слагам го вдясно.“']],tip:'Мнението не е лошо – просто не може само да реши спора.'},
 {t:'Обща цел',i:'🎯',txt:'Целта е едно изречение, с което всички са съгласни. В нея няма „петък“ или „понеделник“ – тя казва какво искаме да постигнем.',who:[['Мими','📣 Говорител','„Значи искаме епизод, качен до сряда, в който участват всички. Съгласни ли сте?“']],tip:'Целта не съдържа нито един от вариантите – така никой не „губи“.'},
 {t:'Варианти и матрица',i:'⚖️',txt:'Екипът избира критерии с тегла: присъстват всички ×3, тих кабинет ×2, време за монтаж ×1. Всеки вариант получава оценка от 1 до 5. Гледай как се смята таблото: оценка × тегло, после сума.',who:[['Борис','🔍 Анализатор','„Петък: 1 × 3 = 3, 5 × 2 = 10, 2 × 1 = 2 – общо 15.“'],['Тео','🤔 Секретар-скептик','„А ако тихият кабинет е по-важен? Да направим тест за устойчивост.“']],tip:'Теглото показва колко е важен критерият. Решава сумата, а не най-силният глас.'},
 {t:'Запис на решението',i:'📝',txt:'Решението се записва конкретно – кой, какво и до кога. Без запис утре всеки ще помни различно.',who:[['Тео','🤔 Секретар-скептик','„Записвам: кой, какво, до кога.“'],['Мими','📣 Говорител','„Решихме: записваме в понеделник!“']],tip:'Записът е готов, когато всеки ред има кой, какво и до кога. Сега сте готови за ситуациите А–Е!'}];
const SM={o:['Петък','Понеделник','Събота'],c:[['Присъстват всички',3],['Тих кабинет',2],['Време за монтаж',1]],v:[[1,5,2],[5,3,4],[2,4,5]]};

function simB(){const nw=i=>i==sp?' nw':'',e=(i,t,c='')=>`<div class="e ${c}">🔒 ${t}<br><small>попълва се на стъпка ${i+1}</small></div>`;

 h+=sp>=1?`<div class="${nw(1)}"><h4>✅ Факти</h4><ul><li>В петък двама са на състезание</li><li>Кабинетът е свободен и в двата дни</li><li>Срок за качване: сряда</li></ul></div><div class="${nw(1)}"><h4>💭 Мнения</h4><ul><li>„В понеделник ще сме уморени“</li><li>„В петък е по-забавно“</li></ul></div>`:e(1,'Факти')+e(1,'Мнения');

 if(sp>=3){const w=simW(),su=simS(),mx=Math.max(...su),wi=SM.o[su.indexOf(mx)];h+=`<div class="w2${nw(3)}"><h4>⚖️ Матрица (оценка × тегло)</h4><div style="overflow-x:auto"><table><tr><th>Критерий</th>${SM.o.map(o=>`<th>${o}</th>`).join('')}</tr>${SM.c.map((c,i)=>`<tr><td>${c[0]} ×${w[i]}${i==1&&stb?' 🔬':''}</td>${SM.o.map((o,k)=>`<td class="mc" id="mc${i}${k}">${SM.v[k][i]} × ${w[i]} = <b>${SM.v[k][i]*w[i]}</b></td>`).join('')}</tr>`).join('')}<tr><td><b>Сума</b></td>${su.map((x,k)=>`<td id="ms${k}" class="${x==mx?'win':''}">${x}${x==mx?' 🏆':''}</td>`).join('')}</tr></table></div>${stb?`<small class="ok">✔ И с „Тих кабинет ×3“ печели ${wi} (${su.join(' · ')}) – решението е устойчиво.</small>`:`<small>Печели ${wi} с ${mx} точки.</small>`}</div>`}else h+=e(3,'Матрица','w2');
 h+=sp>=4?`<div class="w2${nw(4)}"><h4>📝 Решение <span class="stamp">РЕШЕНО ✓</span></h4><p style="margin:2px 0 6px">„Записваме в понеделник.“</p><table><tr><th>Кой</th><th>Какво</th><th>До кога</th></tr><tr><td>Лина</td><td>Резервира кабинета</td><td>до петък</td></tr><tr><td>Борис</td><td>Пише текста</td><td>до понеделник</td></tr><tr><td>Всички</td><td>Записват епизода</td><td>понеделник</td></tr><tr><td>Всеки</td><td>Казва дали е готов</td><td>вторник вечер</td></tr><tr><td>Мими и Тео</td><td>Монтират и качват</td><td>до сряда</td></tr></table></div>`:e(4,'Решение','w2');
 return h+'</div>'}
