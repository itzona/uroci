}
@media print{
 body{background:#fff;font-size:12pt}.nop,.tabs,.tmr,.nav,header button{display:none!important}

}

<script>

function P(cx,by,i,o={}){const s=SK[i%4],c=SH[i%4],h=HR[i%4],hy=by-26;
 let g=`<g class="pp" style="animation-delay:${(i*.37).toFixed(2)}s">`;
 if(i%4==1)g+=`<path d="M${cx-23},${hy} Q${cx-27},${hy+32} ${cx-14},${hy+36} L${cx+14},${hy+36} Q${cx+27},${hy+32} ${cx+23},${hy} Z" fill="${h}"/>`;
 const arm=(x1,y1,x2,y2,qx,qy)=>`<path d="M${x1},${y1} Q${qx},${qy} ${x2},${y2}" stroke="${c}" stroke-width="13" fill="none" stroke-linecap="round"/><circle cx="${x2}" cy="${y2-4}" r="8" fill="${s}"/>`;

 g+=`<rect x="${cx-6}" y="${hy+16}" width="12" height="12" fill="${s}"/><circle cx="${cx}" cy="${hy}" r="21" fill="${s}"/>`;
 const hs=[`M${cx-21},${hy-3} Q${cx-18},${hy-27} ${cx+2},${hy-24} Q${cx+23},${hy-22} ${cx+21},${hy-3} Q${cx+6},${hy-15} ${cx-21},${hy-3}Z`,
  `M${cx-22},${hy+2} Q${cx-22},${hy-26} ${cx},${hy-24} Q${cx+22},${hy-26} ${cx+22},${hy+2} Q${cx+14},${hy-12} ${cx},${hy-12} Q${cx-14},${hy-12} ${cx-22},${hy+2}Z`,

 g+=`<path d="${hs[i%4]}" fill="${h}"/>`;if(i%4==2)g+=`<circle cx="${cx}" cy="${hy-25}" r="8" fill="${h}"/>`;
 const ey=hy+(o.down?4:-1);

 if(o.brow)g+=`<path d="M${cx-11},${ey-7} L${cx-4},${ey-5} M${cx+11},${ey-7} L${cx+4},${ey-5}" stroke="#222" stroke-width="2" stroke-linecap="round"/>`;
 const my=hy+10,mm=o.m||'smile';
 if(mm=='o')g+=`<ellipse cx="${cx}" cy="${my+2}" rx="3.5" ry="4.5" fill="#222"/>`;
 else g+=`<path d="${{smile:`M${cx-7},${my} Q${cx},${my+7} ${cx+7},${my}`,flat:`M${cx-6},${my+2} L${cx+6},${my+2}`,sad:`M${cx-7},${my+5} Q${cx},${my-2} ${cx+7},${my+5}`,big:`M${cx-8},${my} Q${cx},${my+11} ${cx+8},${my} Z`}[mm]}" stroke="#222" stroke-width="2" fill="${mm=='big'?'#7a1f1f':'none'}" stroke-linecap="round"/>`;
 if(o.arm=='up'){g+=arm(cx+24,by+22,cx+40,by-44,cx+44,by-6);if(o.n)g+=`<text x="${cx+40}" y="${by-60}" text-anchor="middle" font-size="22" font-weight="800" fill="#0f1b2d">${o.n}</text>`}

function T(y,tags){let g=`<rect x="20" y="${y}" width="560" height="16" rx="6" fill="#8d6748"/><rect x="32" y="${y+16}" width="536" height="80" fill="#a47c5b"/>`;

<div id="c2"></div>
<details class="nop" ${bank?'open':''} ontoggle="bank=this.open"><summary>💡 Банка с идеи (само ако закъсате)</summary><p class="hint">Натиснете, за да добавите. По-добре е да измислите свои – те са за вашия проект.</p>
${CATS.map(c=>`<div><b style="font-size:.9rem">${c[1]}</b><div class="cats">${SUG[c[0]].map(s=>`<button class="sug" onclick="add(${esc(JSON.stringify(s))},'${c[0]}')">${esc(s)}</button>`).join('')}</div></div>`).join('')}</details>
${nav()}</div>`}
function add(t,c){D.risks.push({t,c,p:0,i:0,s:'',m:'',o:'',w:''});save();draw();const l=document.querySelectorAll('#rl input[type=text]');if(!t&&l.length)l[l.length-1].focus()}
function chk2(){const e=$('#c2');if(!e)return;const R=valid(),cs=new Set(R.map(r=>r.c).filter(Boolean));
 let h=R.length>=5?`<p class="ok">✓ ${R.length} причини – чудесно!</p>`:`<p class="no">Имате ${R.length} от поне 5 причини.</p>`;
 if(R.length)h+=cs.size>=3?`<p class="ok">✓ Покрити са ${cs.size} категории.</p>`:`<p class="hint">⚠ Причините са само от ${cs.size||0} категори${cs.size==1?'я':'и'}. Помислете и за другите – екип, данни, ресурси…</p>`;
 if(R.some(r=>D.names.some(n=>n.trim().length>1&&r.t.includes(n.trim()))))h+=`<p class="no">Махнете имената – търсим причина, не виновен!</p>`;
 e.innerHTML=h}

function s3(){const R=valid();return`<div class="card">${timer()}<h2>⚖️ Оценете всяка причина</h2>${scene('vote')}
<p>Както в урок 5: <b>вероятност</b> (колко е вероятно да се случи) и <b>влияние</b> (колко ще навреди). <b>Оценка = вероятност × влияние</b>, от 1 до 9.</p>
<div class="mxw"><div>${R.length?D.risks.map((r,k)=>r.t.trim()?`<div class="ev"><span><b>${idx(k)}.</b> ${esc(r.t)}</span>
<span><span class="sl">Вероятност</span><span class="seg">${['ниска','средна','висока'].map((x,v)=>`<button class="${r.p==v+1?'on':''}" onclick="D.risks[${k}].p=${v+1};save();draw()">${x}</button>`).join('')}</span></span>
<span><span class="sl">Влияние</span><span class="seg">${['малко','средно','голямо'].map((x,v)=>`<button class="${r.i==v+1?'on':''}" onclick="D.risks[${k}].i=${v+1};save();draw()">${x}</button>`).join('')}</span></span>
<span class="score ${lvl(sc(r))}">${sc(r)||'?'}</span></div>`:'').join(''):'<p class="no">Първо добавете причини в стъпка 2.</p>'}</div>
<div><h3 style="margin-top:0">Матрица на риска</h3>${matrix()}<p class="hint">Числата в кръгчетата са номерата на причините. Горе вдясно е опасната зона.</p></div></div>
<div class="d">🗣 Ако не сте съгласни за оценката, всеки казва число с пръсти (1–3) едновременно. При голяма разлика – тези с крайните оценки обясняват защо.</div>
${nav()}</div>`}
function idx(k){let n=0;for(let j=0;j<=k;j++)if(D.risks[j].t.trim())n++;return n}
function matrix(){let h='<div class="mx">';for(let p=3;p>=1;p--){h+=`<div class="ax v">${['','ниска','средна','висока'][p]}</div>`;for(let i=1;i<=3;i++){const s=p*i;h+=`<div class="c ${lvl(s)}"><i>${s}</i>${D.risks.map((r,k)=>r.t.trim()&&r.p==p&&r.i==i?`<span class="dot" title="${esc(r.t)}">${idx(k)}</span>`:'').join('')}</div>`}}
 h+='<div></div>'+['малко','средно','голямо'].map(x=>`<div class="ax">${x}</div>`).join('')+'</div><div class="hint" style="display:flex;justify-content:space-between"><span>↑ Вероятност</span><span>Влияние →</span></div>';return h}

function order(){return D.risks.map((r,k)=>[r,k]).filter(x=>x[0].t.trim()).sort((a,b)=>sc(b[0])-sc(a[0]))}
function s4(){const O=order(),ppl=D.names.map((n,i)=>[n.trim(),i]).filter(x=>x[0]);return`<div class="card">${timer()}<h2>🛡️ Какво ще направим?</h2>${scene('shield')}
<p>Рисковете са подредени от най-опасния. За всеки изберете <b>стратегия</b>, напишете <b>конкретна мярка</b>, <b>отговорник</b> и <b>ранен сигнал</b> – как ще разберем навреме, че се случва.</p>
<div class="gr">${STR.map(s=>`<div class="bx"><b>${s[1]}</b><span class="hint">${s[2]}</span></div>`).join('')}</div>
${O.length?O.map(([r,k])=>{const s=sc(r);return`<div class="rx ${lvl(s)}"><div class="top"><span class="score ${lvl(s)}">${s||'?'}</span><b>${esc(r.t)}</b></div>
<div class="strat">${STR.map(x=>`<button class="${r.s==x[0]?'on':''}" onclick="D.risks[${k}].s='${x[0]}';save();draw()">${x[1]}</button>`).join('')}</div>
${s>=6&&r.s==='accept'?'<p class="no" style="margin:6px 0 0">⚠ Висок риск и „приемане“? Това е опасно – помислете дали не може да го намалите.</p>':''}
<div class="f"><label>Мярка – какво точно правим?<input type="text" value="${esc(r.m)}" oninput="D.risks[${k}].m=this.value;save()" placeholder="${r.s==='accept'?'резервен план, ако се случи':'напр. всяка вечер копие в общата папка'}"></label>
<label>Отговорник<select onchange="D.risks[${k}].o=this.value;save()"><option value="">– кой? –</option>${ppl.map(([n,i])=>`<option value="${i}" ${r.o!==''&&r.o==i?'selected':''}>${esc(n)}</option>`).join('')}<option value="all" ${r.o=='all'?'selected':''}>Целият екип</option></select></label>
<label>Ранен сигнал<input type="text" value="${esc(r.w)}" oninput="D.risks[${k}].w=this.value;save()" placeholder="напр. в сряда още няма тестова версия"></label></div></div>`}).join(''):'<p class="no">Първо добавете и оценете причини.</p>'}
${!ppl.length?'<p class="hint">Попълнете имената в „Как работи“, за да изберете отговорници.</p>':''}
<div class="d">✅ Добрата мярка е <b>конкретна</b> (кой, какво, кога). „Ще внимаваме“ не е мярка. „Всеки петък Иво проверява дали има копие в облака“ е мярка.</div>
${nav()}</div>`}

function owner(r){return r.o==='all'?'Целият екип':(r.o!==''&&r.o!=null&&D.names[r.o]?.trim())||'—'}
function stT(r){return(STR.find(x=>x[0]==r.s)||['','—'])[1]}
function catT(r){return(CATS.find(x=>x[0]==r.c)||['','—'])[1]}
function s5(){const O=order(),R=valid(),hi=R.filter(r=>sc(r)>=6),cs=new Set(R.map(r=>r.c).filter(Boolean));
 const C=[[R.length>=5,`Поне 5 риска (имате ${R.length})`],[R.length&&R.every(r=>r.p&&r.i),'Всички са оценени'],[cs.size>=3,'Поне 3 различни категории'],[R.length&&R.every(r=>r.s&&r.m.trim().length>=10),'Всеки риск има стратегия и конкретна мярка'],[R.length&&R.every(r=>r.o!==''&&r.o!=null),'Всеки риск има отговорник'],[!hi.some(r=>r.s==='accept'),'Нито един висок риск не е оставен на „приемане“']];
 return`<div class="card">${[0,1,2,3,4].every(done)?scene('win'):''}<h2>📋 Регистър на рисковете</h2>
<p><b>Екип:</b> ${esc(D.team)||'—'} · <b>Проект:</b> ${esc(topicT())} · <b>Членове:</b> ${esc(D.names.filter(n=>n.trim()).join(', '))||'—'}</p>
<div class="tw"><table><tr><th>№</th><th>Риск</th><th>Категория</th><th>В × Вл</th><th>Оценка</th><th>Стратегия</th><th>Мярка</th><th>Отговорник</th><th>Ранен сигнал</th></tr>
${O.map(([r],n)=>`<tr><td>${n+1}</td><td>${esc(r.t)}</td><td>${catT(r)}</td><td>${r.p||'?'} × ${r.i||'?'}</td><td><span class="score ${lvl(sc(r))}">${sc(r)||'?'}</span><br><small>${lvlT(sc(r))}</small></td><td>${stT(r)}</td><td>${esc(r.m)||'—'}</td><td>${esc(owner(r))}</td><td>${esc(r.w)||'—'}</td></tr>`).join('')||'<tr><td colspan="9">Няма рискове.</td></tr>'}</table></div>
<h3>✔ Проверка</h3><ul class="chk">${C.map(c=>`<li>${c[0]?'<span class="ok">✓</span>':'<span class="no">✗</span>'} ${c[1]}</li>`).join('')}</ul>
<h3>💭 Размисъл</h3>
<p><label style="display:block">Коя причина за провала ви изненада най-много и защо?<textarea oninput="set('refl.0',this.value)">${esc(D.refl[0])}</textarea></label></p>
<p><label style="display:block">Какво ще промените в плана на проекта още тази седмица?<textarea oninput="set('refl.1',this.value)">${esc(D.refl[1])}</textarea></label></p>
<div class="nop" style="display:flex;gap:8px;flex-wrap:wrap"><button class="go" onclick="window.print()">🖨 Принтирай / запази като PDF</button><button onclick="copyT()">📋 Копирай като текст</button><button onclick="if(confirm('Да изчистя ли всичко за нов екип?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}">🗑 Нов екип</button></div>
<p id="cp" class="ok"></p>
<div class="t nop">📁 Този регистър е част от екипния проект (урок 12, „Анализ на риска“ – 15 т.). Копирайте таблицата в документа на екипа или я запазете като PDF. Връщайте се към нея всяка седмица – рисковете се <b>наблюдават</b>, не само се записват.</div>
${nav()}</div>`}
function copyT(){const O=order();let t=`РЕГИСТЪР НА РИСКОВЕТЕ\nЕкип: ${D.team}\nПроект: ${topicT()}\nЧленове: ${D.names.filter(n=>n.trim()).join(', ')}\n\n№\tРиск\tКатегория\tВероятност\tВлияние\tОценка\tСтратегия\tМярка\tОтговорник\tРанен сигнал\n`;
 O.forEach(([r],n)=>{t+=[n+1,r.t,catT(r).replace(/^\S+ /,''),r.p||'',r.i||'',sc(r)||'',stT(r).replace(/^\S+ /,''),r.m,owner(r),r.w].join('\t')+'\n'});
 t+=`\nИзненада ни: ${D.refl[0]}\nПромяна в плана: ${D.refl[1]}\n`;
 const ok=()=>{$('#cp').textContent='✓ Копирано! Поставете в Word или Excel (таблицата се запазва).'};
 if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>fb(t,ok));else fb(t,ok)}
function fb(t,ok){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){alert('Маркирайте таблицата и копирайте ръчно.')}a.remove()}
function party(){for(let i=0;i<30;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','🛡️','✅','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}}
let partied=false;
function draw(){$('#m').innerHTML=[s0,s1,s2,s3,s4,s5][cur]();tabs();if(cur==2)chk2();
 if(cur==5&&!partied&&[0,1,2,3,4].every(done)){partied=true;party()}}
left=STEPS[0][2]*60;prog();draw();
</script>
</body></html>
